name: Stage 71G DNB Capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
      API_FOOTBALL_SEASON: '2026'
      STAGE71G_USER_BOOKMAKER: 'Marathonbet'
      STAGE71G_OPEN_HORIZON_H: '336'
      STAGE71G_TRACK_HORIZON_H: '72'
      STAGE71G_NEXT_PER_LEAGUE: '10'
      STAGE71G_AH_BET_ID: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture DNB line-zero market data
        run: python scripts/stage71g_dnb_capture.py
      - name: Show Stage71G summary
        run: cat ops/stage71g_last_run.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage71g-dnb-diagnostic
          path: |
            ops/stage71g_dnb_openers.csv
            ops/stage71g_dnb_snapshots.csv
            ops/stage71g_dnb_closes.csv
            ops/stage71g_last_run.json
          if-no-files-found: ignore
          retention-days: 7
