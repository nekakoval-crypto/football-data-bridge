name: Stage 71G DNB Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/stage71g_dnb_capture.py'
      - 'research/stage71g_dnb_prospective_capture_prereg_2026-09-11.md'
      - '.github/workflows/stage71g-dnb-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
      API_FOOTBALL_SEASON: '2026'
      STAGE71G_USER_BOOKMAKER: 'Marathonbet'
      STAGE71G_OPEN_HORIZON_H: '336'
      STAGE71G_TRACK_HORIZON_H: '72'
      STAGE71G_NEXT_PER_LEAGUE: '10'
      STAGE71G_AH_BET_ID: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture DNB line-zero market data
        run: |
          for attempt in 1 2 3; do
            echo "Stage71G attempt ${attempt}/3"
            if python scripts/stage71g_dnb_capture.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Show Stage71G summary
        run: cat ops/stage71g_last_run.json
      - name: Commit Stage71G operational files
        run: |
          git config user.name 'stage71g-bot'
          git config user.email 'stage71g-bot@users.noreply.github.com'
          git add ops/stage71g_dnb_openers.csv ops/stage71g_dnb_snapshots.csv ops/stage71g_dnb_closes.csv ops/stage71g_last_run.json
          if git diff --cached --quiet; then
            echo 'No Stage71G changes to commit.'
          else
            git commit -m 'Stage71G DNB capture update'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage71g-dnb-capture
          path: |
            ops/stage71g_dnb_openers.csv
            ops/stage71g_dnb_snapshots.csv
            ops/stage71g_dnb_closes.csv
            ops/stage71g_last_run.json
          if-no-files-found: ignore
          retention-days: 30
