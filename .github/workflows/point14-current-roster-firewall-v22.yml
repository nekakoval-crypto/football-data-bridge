name: Point14 current roster firewall V22

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v22:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run V22 tests
        run: python -m unittest scripts.tests.test_point14_current_roster_firewall_v22 -v
      - name: Run real current-roster expected XI proof
        run: python -m scripts.point14_current_roster_firewall_v22
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: point14-current-roster-firewall-v22
          path: ops/point14_current_expected_xi_v22.json
          if-no-files-found: error
