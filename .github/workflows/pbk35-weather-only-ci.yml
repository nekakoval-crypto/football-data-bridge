name: PBK35 Weather Only Portable CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pbk35/**'
      - '.github/workflows/pbk35-weather-only-ci.yml'
  push:
    branches:
      - 'pbk35-weather-only-*'
    paths:
      - 'pbk35/**'
      - '.github/workflows/pbk35-weather-only-ci.yml'

permissions:
  contents: read

jobs:
  portable-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all weather modules
        run: |
          python -m py_compile \
            pbk35/weather_only_worker_v2.py \
            pbk35/venue_bridge_v1.py \
            pbk35/calendar_sync_v1.py \
            pbk35/weather_evidence_gate.py

      - name: Verify portable source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          for file in Path("pbk35").glob("*.py"):
              ast.parse(file.read_text(encoding="utf-8-sig"))

          text = Path(
              "pbk35/weather_only_worker_v2.py"
          ).read_text(encoding="utf-8-sig")

          assert "PBK35_SOURCE_ROOT_REQUIRED" in text
          assert "PBK35_ROOT" in text
          assert 'r"I:\\PBK' not in text

          print("PBK35 PORTABILITY = PASS")
          print("API CALLS = 0")
          print("WEATHER ARCHIVE MODIFIED = NO")
          PY
