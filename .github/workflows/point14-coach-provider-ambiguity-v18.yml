name: Point14 coach provider ambiguity V18

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v18-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto
      API_FOOTBALL_MAX_REAL_CALLS: 0
      PYTHONPATH: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install raw archive dependency
        run: python -m pip install boto3

      - name: Verify archive credentials exist
        shell: bash
        run: |
          test -n "$PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID"
          test -n "$PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY"
          test -n "$PBK_RAW_ARCHIVE_S3_ENDPOINT"
          test -n "$PBK_RAW_ARCHIVE_S3_BUCKET"

      - name: Run archive-only provider ambiguity proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/point14_coach_provider_ambiguity_v18.py

      - name: Verify tenure ledger unchanged
        shell: bash
        run: git diff --exit-code -- ops/coach_tenure_history.csv

      - name: Upload V18 artifact
        uses: actions/upload-artifact@v4
        with:
          name: point14-coach-provider-ambiguity-v18
          path: ops/point14_coach_provider_ambiguity_v18.json
          if-no-files-found: error
