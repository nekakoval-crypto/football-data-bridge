name: Operational publish safety
on:
  pull_request:
    paths:
      - 'scripts/publish_operational_commit.py'
      - 'scripts/tests/test_operational_publish.py'
      - '.github/workflows/**'
  push:
    paths:
      - 'scripts/publish_operational_commit.py'
      - 'scripts/tests/test_operational_publish.py'
      - '.github/workflows/operational-publish-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_operational_publish.py -v
