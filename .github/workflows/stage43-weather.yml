name: stage43-weather

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage43_weather.py'
      - '.github/workflows/stage43-weather.yml'
  workflow_dispatch:

jobs:
  build-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build historical match weather layer
        run: |
          python scripts/stage43_weather.py

      - name: Upload Stage 43 weather artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage43-weather-data
          path: out/
          compression-level: 6
          retention-days: 7
