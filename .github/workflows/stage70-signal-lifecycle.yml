name: Stage 70 Signal Lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: '57 * * * *'
  push:
    paths:
      - 'scripts/stage70_signal_lifecycle.py'
      - '.github/workflows/stage70-signal-lifecycle.yml'

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Stage 70 lifecycle cards
        run: python scripts/stage70_signal_lifecycle.py

      - name: Show Stage 70 summary
        run: |
          cat ops/stage70_last_run.json
          echo '--- signal_lifecycle_cards.md ---'
          cat ops/signal_lifecycle_cards.md

      - name: Commit Stage 70 operational files
        run: |
          git config user.name 'stage70-bot'
          git config user.email 'stage70-bot@users.noreply.github.com'
          git add -A ops
          if git diff --cached --quiet; then
            echo 'No Stage 70 changes to commit.'
          else
            git commit -m 'Stage 70 signal lifecycle update'
            git push
          fi

      - name: Upload Stage 70 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage70-signal-lifecycle
          path: |
            ops/signal_lifecycle_events.csv
            ops/signal_lifecycle_cards.json
            ops/signal_lifecycle_cards.md
            ops/stage70_last_run.json
          if-no-files-found: error
          retention-days: 30
