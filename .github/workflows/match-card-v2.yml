name: Match Card v2

on:
  pull_request:
    paths:
      - 'scripts/match_card_v2.py'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_match_card_v2*.py'
      - 'app/match-card.js'
      - 'app/tests/match-card*.test.mjs'
      - '.github/workflows/match-card-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match Card v2 tests
        run: python -m unittest discover -s scripts/tests -p 'test_match_card_v2*.py' -v
      - name: Match Card frontend lifecycle tests
        run: node --test app/tests/match-card*.test.mjs
      - name: Today LIVE regression
        run: python -m unittest discover -s scripts/tests -p 'test_today_live_api.py' -v
      - name: Standings motivation regression
        run: python -m unittest discover -s scripts/tests -p 'test_standings*.py' -v
      - name: Compile changed API modules
        run: python -m py_compile scripts/match_card_v2.py scripts/stage73_internal_api.py
