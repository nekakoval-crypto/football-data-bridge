name: Stage 270 Prematch Venue State

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'scripts/stage270_prematch_venue_state.py'
      - 'scripts/tests/test_stage270_prematch_venue_state.py'
      - 'config/pbk_fixture_venue_state_evidence.csv'
      - '.github/workflows/stage270-prematch-venue-state.yml'

  push:
    branches:
      - main
    paths:
      - 'scripts/stage270_prematch_venue_state.py'
      - 'scripts/tests/test_stage270_prematch_venue_state.py'
      - 'config/pbk_fixture_venue_state_evidence.csv'
      - 'config/pbk_venue_overrides.csv'
      - '.github/workflows/stage270-prematch-venue-state.yml'

  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: stage270-prematch-venue-state
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile             scripts/stage270_prematch_venue_state.py             scripts/tests/test_stage270_prematch_venue_state.py
      - name: Contract tests
        run: |
          python -m unittest scripts.tests.test_stage270_prematch_venue_state -v

  materialize:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prematch venue state
        run: python scripts/stage270_prematch_venue_state.py
      - name: Verify no-lookahead authority
        run: |
          python - <<'PY'
          import csv, json

          with open('ops/stage270_prematch_venue_state_last_run.json', encoding='utf-8') as f:
              meta=json.load(f)
          assert meta['status']=='OK'
          assert meta['provider_calls']==0
          assert meta['web_calls']==0
          assert meta['postkickoff_evidence_accepted']==0

          with open('ops/prematch_venue_state.csv', encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))

          assert all(r['context_only']=='YES' for r in rows)
          assert all(r['predictive_authority']=='NOT_AUTHORIZED' for r in rows)
          assert all(r['betting_authority']=='NOT_AUTHORIZED' for r in rows)
          assert all(
              not (
                  r['roof_state_requirement']=='PREMATCH_REQUIRED'
                  and r['roof_state_capture_status']=='NOT_CAPTURED'
                  and r['usable_for_prematch']=='true'
              )
              for r in rows
          )
          print({
              'rows': len(rows),
              'retractable': meta['retractable_roof_rows'],
              'unresolved': meta['unresolved_retractable_roof_rows'],
          })
          PY
      - name: Publish operational state
        shell: bash
        run: |
          git config user.name 'stage270-bot'
          git config user.email 'stage270-bot@users.noreply.github.com'
          git add ops/prematch_venue_state.csv ops/stage270_prematch_venue_state_last_run.json
          if git diff --cached --quiet; then
            echo 'No Stage270 changes.'
            exit 0
          fi
          git commit -m 'Stage 270 prematch venue state update'
          python scripts/publish_operational_commit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage270-prematch-venue-state
          path: |
            ops/prematch_venue_state.csv
            ops/stage270_prematch_venue_state_last_run.json
          if-no-files-found: error
          retention-days: 30
