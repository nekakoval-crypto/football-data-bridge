name: Stage 80 Match Event Archive

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */2 * * *'
  pull_request:
    paths:
      - 'scripts/stage80_match_event_capture.py'
      - 'scripts/tests/test_stage80_match_event_capture.py'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_archive_readiness.py'
      - '.github/workflows/stage80-match-events.yml'
  push:
    paths:
      - 'scripts/stage80_match_event_capture.py'
      - 'scripts/tests/test_stage80_match_event_capture.py'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_archive_readiness.py'
      - '.github/workflows/stage80-match-events.yml'

permissions:
  contents: read

concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile match event archive
        run: |
          python -m py_compile scripts/stage80_match_event_capture.py
          python -m py_compile scripts/tests/test_stage80_match_event_capture.py
          python -m py_compile scripts/stage80_archive_manifest.py
          python -m py_compile scripts/stage80_archive_readiness.py
      - name: Match event archive tests
        run: |
          python -m unittest scripts.tests.test_stage80_match_event_capture -v
      - name: Shared-broker isolation
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports' scripts/stage80_match_event_capture.py; then
            echo 'Match event capture must reach API-Football only through the shared broker.' >&2
            exit 1
          fi
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated ops files are forbidden in the event archive feature PR.' >&2
            exit 1
          fi

  capture:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: ops
      STAGE80_EVENT_MAX_API_CALLS: '8'
      STAGE80_EVENT_MAX_FIXTURES_PER_RUN: '8'
      STAGE71_MAX_DAILY_API_CALLS: '7000'
      STAGE80_EVENT_STANDINGS_RESERVE_CALLS: '16'
      STAGE80_EVENT_PLAYER_STATS_RESERVE_CALLS: '4'
      STAGE80_EVENT_TEAM_STATS_RESERVE_CALLS: '12'
      STAGE80_EVENT_SAFETY_RESERVE_CALLS: '8'
      STAGE80_EVENT_CURRENT_ROUND_CALLS_PER_RUN: '32'
      API_FOOTBALL_ARCHIVE_DIR: ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture terminal-fixture match events
        run: python scripts/stage80_match_event_capture.py
      - name: Refresh Stage80 manifest and readiness
        run: |
          python scripts/stage80_archive_manifest.py
          python scripts/stage80_archive_readiness.py
      - name: Publish match event archive safely
        shell: bash
        run: |
          git config user.name 'stage80-bot'
          git config user.email 'stage80-bot@users.noreply.github.com'
          git add ops/match_event_snapshots.csv ops/stage80_match_event_backlog.csv ops/stage80_match_event_last_run.json
          git add ops/stage71_observation_state.json
          git add ops/stage80_archive_manifest.json ops/stage80_archive_manifest.csv
          git add ops/stage80_archive_readiness.json ops/stage80_archive_readiness.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 match event archive update'
          git restore --worktree -- .
          python scripts/publish_operational_commit.py
