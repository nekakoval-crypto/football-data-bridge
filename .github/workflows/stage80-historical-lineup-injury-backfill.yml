name: Stage 80 Historical Lineup Injury Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1-23/4 * * *'
  pull_request:
    paths:
      - 'scripts/stage80_historical_lineup_injury_backfill.py'
      - 'scripts/tests/test_stage80_historical_lineup_injury_backfill.py'
      - '.github/workflows/stage80-historical-lineup-injury-backfill.yml'

permissions:
  contents: read

concurrency:
  group: stage80-historical-lineup-injury-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and provider-free tests
        run: |
          python -m py_compile scripts/stage80_historical_lineup_injury_backfill.py
          python -m unittest scripts.tests.test_stage80_historical_lineup_injury_backfill -v
      - name: Provider isolation
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports' scripts/stage80_historical_lineup_injury_backfill.py; then
            echo 'Historical lineup/injury backfill must reach API-Football only through the shared broker/backend.' >&2
            exit 1
          fi
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated historical lineup/injury outputs are forbidden in the feature PR.' >&2
            exit 1
          fi

  backfill:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto
      OPS_DIR: ops
      STAGE71_MAX_DAILY_API_CALLS: '7000'
      STAGE80_HISTORICAL_INJURY_NO_DATA_CELL_THRESHOLD: '8'
      STAGE80_PROVIDER_CALL_TIMEOUT_SECONDS: '45'
      STAGE80_HEARTBEAT_EVERY_TASKS: '10'
      STAGE80_MAX_CONSECUTIVE_PROVIDER_ERRORS: '5'
      STAGE80_CHECKPOINT_EVERY_TASKS: '25'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raw archive S3 client
        run: python -m pip install --disable-pip-version-check boto3

      - name: Select historical lineup backfill budget
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "STAGE80_HISTORICAL_LINEUP_INJURY_MAX_API_CALLS=50" >> "$GITHUB_ENV"
            echo "PBK Stage80 scheduled historical lineup budget: 50 calls"
          else
            echo "STAGE80_HISTORICAL_LINEUP_INJURY_MAX_API_CALLS=600" >> "$GITHUB_ENV"
            echo "PBK Stage80 manual historical lineup budget: 600 calls"
          fi

      - name: Run resumable PBK16 historical lineup injury backfill
        run: python scripts/stage80_historical_lineup_injury_backfill.py
      - name: Show backfill telemetry
        run: cat ops/stage80_historical_lineup_injury_backfill_last_run.json
      - name: Publish historical availability evidence safely
        shell: bash
        run: |
          git config user.name 'stage80-historical-availability-bot'
          git config user.email 'stage80-historical-availability-bot@users.noreply.github.com'
          git add ops/historical_lineup_snapshots.csv
          git add ops/historical_injury_snapshots.csv
          git add ops/stage80_historical_lineup_injury_backfill_state.csv
          git add ops/stage80_historical_lineup_injury_backfill_last_run.json
          git add ops/stage80_historical_lineup_injury_budget_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Stage 80 historical lineup injury backfill update'
          git restore --worktree -- .
          python scripts/publish_operational_commit.py
      - name: Upload backfill telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage80-historical-lineup-injury-backfill
          path: |
            ops/stage80_historical_lineup_injury_backfill_last_run.json
            ops/stage80_historical_lineup_injury_backfill_state.csv
            ops/stage80_historical_lineup_injury_budget_state.json
            ops/historical_lineup_snapshots.csv
            ops/historical_injury_snapshots.csv
          if-no-files-found: warn
          retention-days: 30