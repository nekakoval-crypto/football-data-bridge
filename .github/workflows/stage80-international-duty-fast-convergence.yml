name: Stage 80 International Duty Fast Convergence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage80-international-duty-fast-convergence.yml'
      - 'scripts/tests/test_stage80_international_duty_fast_convergence.py'
      - 'scripts/stage80_international_duty_player_identity_join.py'
      - 'scripts/stage80_international_duty_player_temporal_club.py'
      - 'scripts/stage80_international_duty_pbk16_club_identity.py'
      - 'scripts/stage80_international_duty_return_load.py'
  pull_request:
    paths:
      - '.github/workflows/stage80-international-duty-fast-convergence.yml'
      - 'scripts/tests/test_stage80_international_duty_fast_convergence.py'
      - 'scripts/stage80_international_duty_player_identity_join.py'
      - 'scripts/stage80_international_duty_player_temporal_club.py'
      - 'scripts/stage80_international_duty_pbk16_club_identity.py'
      - 'scripts/stage80_international_duty_return_load.py'

permissions:
  contents: read

concurrency:
  group: stage80-international-duty-fast-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provider-free convergence scripts
        run: |
          python -m py_compile             scripts/stage80_international_duty_player_identity_join.py             scripts/stage80_international_duty_player_temporal_club.py             scripts/stage80_international_duty_pbk16_club_identity.py             scripts/stage80_international_duty_return_load.py             scripts/tests/test_stage80_international_duty_fast_convergence.py
      - name: Run convergence rail tests
        run: |
          python -m unittest             scripts.tests.test_stage80_international_duty_player_identity_join             scripts.tests.test_stage80_international_duty_player_temporal_club             scripts.tests.test_stage80_international_duty_pbk16_club_identity             scripts.tests.test_stage80_international_duty_return_load             scripts.tests.test_stage80_international_duty_fast_convergence -v
      - name: Provider isolation
        shell: bash
        run: |
          for f in             scripts/stage80_international_duty_player_identity_join.py             scripts/stage80_international_duty_player_temporal_club.py             scripts/stage80_international_duty_pbk16_club_identity.py             scripts/stage80_international_duty_return_load.py; do
            if grep -nE 'urllib\.|requests\.|api-sports\.io|ApiFootballBroker|api_get|curl' "$f"; then
              echo "Provider traffic detected in $f" >&2
              exit 1
            fi
          done
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated ops files are forbidden in feature PR.' >&2
            exit 1
          fi

  convergence:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact player identity join
        run: python scripts/stage80_international_duty_player_identity_join.py
      - name: Rebuild bounded historical club-at-date
        run: python scripts/stage80_international_duty_player_temporal_club.py
      - name: Rebuild PBK16 club identity
        run: python scripts/stage80_international_duty_pbk16_club_identity.py
      - name: Rebuild window-return load V2
        run: python scripts/stage80_international_duty_return_load.py
      - name: Verify fast convergence contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ops=Path('ops')
          identity=json.loads((ops/'stage80_international_duty_player_identity_join_last_run.json').read_text(encoding='utf-8'))
          temporal=json.loads((ops/'stage80_international_duty_player_temporal_club_last_run.json').read_text(encoding='utf-8'))
          club=json.loads((ops/'stage80_international_duty_pbk16_club_identity_last_run.json').read_text(encoding='utf-8'))
          ret=json.loads((ops/'stage80_international_duty_return_load_last_run.json').read_text(encoding='utf-8'))

          assert identity['status']=='OK'
          assert temporal['status']=='OK'
          assert club['status']=='OK'
          assert ret['status']=='OK'
          assert identity['evidence_rows']==temporal['evidence_rows']
          assert temporal['bounded_chain_confirmed_rows']==club['bounded_input_rows']
          assert club['mapped_pbk16_rows']==ret['mapped_pbk16_input_rows']
          assert ret['direct_evidence_rows']==identity['evidence_rows']

          assert identity['duplicate_output_players']==0
          assert temporal['duplicate_fixture_player_rows']==0
          assert club['duplicate_fixture_player_rows']==0
          assert ret['duplicate_output_rows']==0

          assert identity['fuzzy_matching_used'] is False
          assert temporal['current_club_substituted'] is False
          assert temporal['fuzzy_club_matching_used'] is False
          assert club['current_player_club_used_for_identity'] is False
          assert club['fuzzy_matching_used'] is False
          assert ret['current_club_used'] is False
          assert ret['fuzzy_matching_used'] is False
          assert ret['travel_inferred'] is False
          assert ret['formal_callup_inferred'] is False
          assert ret['provider_calls']==0

          summary={
            'version':'PBK_STAGE80_INTERNATIONAL_DUTY_FAST_CONVERGENCE_V1',
            'status':'OK',
            'mode':'PROVIDER_FREE_EXISTING_EVIDENCE',
            'historical_backfill_decoupled':True,
            'workflow_run_depth_dependency':False,
            'provider_calls':0,
            'evidence_rows':identity['evidence_rows'],
            'international_players':identity['international_evidence_players'],
            'bounded_rows':temporal['bounded_chain_confirmed_rows'],
            'pbk16_mapped_rows':club['mapped_pbk16_rows'],
            'return_load_rows':ret['output_rows'],
            'research_only':True,
            'operational_betting_authority':False,
            'probability_mutation':False,
            'eligibility_mutation':False,
            'stake_changes':False,
          }
          (ops/'stage80_international_duty_fast_convergence_last_run.json').write_text(
            json.dumps(summary,ensure_ascii=False,indent=2)+'\n',
            encoding='utf-8'
          )
          print(summary)
          PY
      - name: Publish fast convergence proof safely
        shell: bash
        run: |
          git config user.name 'stage80-international-duty-bot'
          git config user.email 'stage80-international-duty-bot@users.noreply.github.com'
          git add             ops/international_duty_player_identity_join.csv             ops/stage80_international_duty_player_identity_join_last_run.json             ops/international_duty_player_temporal_club.csv             ops/stage80_international_duty_player_temporal_club_last_run.json             ops/international_duty_player_pbk16_club_identity.csv             ops/stage80_international_duty_pbk16_club_identity_last_run.json             ops/international_duty_player_return_load.csv             ops/stage80_international_duty_return_load_last_run.json             ops/stage80_international_duty_fast_convergence_last_run.json
          if git diff --cached --quiet; then
            echo 'No fast convergence changes to publish.'
            exit 0
          fi
          git commit -m 'Stage 80 international-duty fast convergence proof'
          python scripts/publish_operational_commit.py
