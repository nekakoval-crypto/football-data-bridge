name: Stage 292 R2 Statistics Coverage Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage292_r2_statistics_coverage_audit.py'
      - 'scripts/tests/test_stage292_r2_statistics_coverage_audit.py'
      - '.github/workflows/stage292-r2-statistics-coverage-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/stage292_r2_statistics_coverage_audit.py'
      - 'scripts/tests/test_stage292_r2_statistics_coverage_audit.py'
      - '.github/workflows/stage292-r2-statistics-coverage-audit.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python -m py_compile scripts/stage292_r2_statistics_coverage_audit.py
          python -m unittest scripts.tests.test_stage292_r2_statistics_coverage_audit -v
      - name: Provider isolation
        shell: bash
        run: |
          if grep -nE 'API_FOOTBALL_KEY|api-sports\.io|requests\.|urllib\.' scripts/stage292_r2_statistics_coverage_audit.py; then
            echo 'Coverage audit must remain provider-free.' >&2
            exit 1
          fi

  audit:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPS_DIR: ops
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto
      STAGE292_R2_COVERAGE_WORKERS: '64'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Audit exact historical statistics coverage
        run: python scripts/stage292_r2_statistics_coverage_audit.py
      - name: Publish coverage report safely
        shell: bash
        run: |
          git config user.name 'stage292-coverage-bot'
          git config user.email 'stage292-coverage-bot@users.noreply.github.com'
          git add ops/stage292_r2_statistics_coverage_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 292 R2 statistics coverage audit update'
          python scripts/publish_operational_commit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage292-r2-statistics-coverage-audit
          path: ops/stage292_r2_statistics_coverage_audit.json
          if-no-files-found: warn
          retention-days: 90
