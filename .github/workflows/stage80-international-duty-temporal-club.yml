name: Stage 80 International Duty Temporal Club

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Stage 80 International Duty Player Identity Join']
    types: [completed]
  pull_request:
    paths:
      - 'scripts/stage80_international_duty_player_temporal_club.py'
      - 'scripts/tests/test_stage80_international_duty_player_temporal_club.py'
      - '.github/workflows/stage80-international-duty-temporal-club.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage80_international_duty_player_temporal_club.py'
      - 'scripts/tests/test_stage80_international_duty_player_temporal_club.py'
      - '.github/workflows/stage80-international-duty-temporal-club.yml'

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile and provider-free tests
        run: |
          python -m py_compile scripts/stage80_international_duty_player_temporal_club.py
          python -m unittest scripts.tests.test_stage80_international_duty_player_temporal_club -v
      - name: Provider isolation
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|ApiFootballBroker|api_get' scripts/stage80_international_duty_player_temporal_club.py; then exit 1; fi
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then exit 1; fi

  materialize:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build bounded temporal club projection
        run: python scripts/stage80_international_duty_player_temporal_club.py
      - name: Verify temporal club governance
        run: |
          python - <<'PY'
          import csv,json
          m=json.load(open('ops/stage80_international_duty_player_temporal_club_last_run.json',encoding='utf-8'))
          assert m['version']=='PBK_STAGE80_INTERNATIONAL_DUTY_TEMPORAL_CLUB_V1_BOUNDED_CHAIN_ONLY'
          assert m['status']=='OK'
          assert m['evidence_rows']==m['output_rows']>0
          assert m['invalid_evidence_rows']==0
          assert m['duplicate_fixture_player_rows']==0
          assert m['invalid_output_rows']==0
          assert m['pbk16_club_identity_derived'] is False
          assert m['current_club_substituted'] is False
          assert m['unbounded_transfer_history_used_as_fact'] is False
          assert m['fuzzy_club_matching_used'] is False
          assert m['provider_calls']==0
          assert m['operational_betting_authority'] is False
          with open('ops/international_duty_player_temporal_club.csv',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==m['output_rows']
          assert len({(r['fixture_id'],r['player_id']) for r in rows})==len(rows)
          assert all(r['current_club_substituted']=='false' for r in rows)
          assert all(r['fuzzy_club_matching_used']=='false' for r in rows)
          print({'bounded':m['bounded_chain_confirmed_rows'],'players':m['bounded_chain_confirmed_players'],'coverage':m['bounded_chain_coverage_pct'],'statuses':m['status_counts']})
          PY
      - name: Publish temporal club projection
        run: |
          git config user.name 'stage80-international-duty-bot'
          git config user.email 'stage80-international-duty-bot@users.noreply.github.com'
          git add ops/international_duty_player_temporal_club.csv ops/stage80_international_duty_player_temporal_club_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 international-duty temporal club update'
          python scripts/publish_operational_commit.py
