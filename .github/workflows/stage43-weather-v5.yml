name: stage43-weather-v5
on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage43_weather_v5.py'
      - '.github/workflows/stage43-weather-v5.yml'
  workflow_dispatch:

jobs:
  build-weather-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build historical weather layer v5
        run: python scripts/stage43_weather_v5.py
      - name: Upload Stage 43 weather v5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage43-weather-v5
          path: out_v5/
          compression-level: 6
          retention-days: 7
