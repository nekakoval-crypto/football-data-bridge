name: Stage 271 Environmental Stress Features

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'scripts/stage271_environmental_stress_features.py'
      - 'scripts/tests/test_stage271_environmental_stress_features.py'
      - '.github/workflows/stage271-environmental-stress-features.yml'

  push:
    branches:
      - main
    paths:
      - 'scripts/stage271_environmental_stress_features.py'
      - 'scripts/tests/test_stage271_environmental_stress_features.py'
      - '.github/workflows/stage271-environmental-stress-features.yml'

  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: write

concurrency:
  group: stage271-environmental-stress-features
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile             scripts/stage271_environmental_stress_features.py             scripts/tests/test_stage271_environmental_stress_features.py
      - name: Contract tests
        run: |
          python -m unittest scripts.tests.test_stage271_environmental_stress_features -v

  materialize:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build environmental features
        run: python scripts/stage271_environmental_stress_features.py
      - name: Verify governance
        run: |
          python - <<'PY'
          import csv, json

          with open('ops/stage271_environmental_stress_last_run.json', encoding='utf-8') as f:
              meta=json.load(f)

          assert meta['status']=='OK'
          assert meta['provider_calls']==0
          assert meta['web_calls']==0
          assert meta['aggregate_environment_score'] is False
          assert meta['double_counting_guard'] is True
          assert meta['postmatch_weather_allowed'] is False
          assert meta['predictive_authority']=='NOT_AUTHORIZED'
          assert meta['betting_authority']=='NOT_AUTHORIZED'

          with open('ops/environmental_stress_features.csv', encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))

          assert all(r['context_only']=='YES' for r in rows)
          assert all(r['research_only']=='YES' for r in rows)
          assert all(r['probability_mutation']=='false' for r in rows)
          assert all(r['eligibility_mutation']=='false' for r in rows)
          assert all(r['stake_changes']=='false' for r in rows)

          print({'rows': len(rows), 'states': meta['state_counts']})
          PY
      - name: Publish operational features
        shell: bash
        run: |
          git config user.name 'stage271-bot'
          git config user.email 'stage271-bot@users.noreply.github.com'
          git add             ops/environmental_stress_features.csv             ops/stage271_environmental_stress_last_run.json

          if git diff --cached --quiet; then
            echo 'No Stage271 changes.'
            exit 0
          fi

          git commit -m 'Stage 271 environmental stress feature update'
          python scripts/publish_operational_commit.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage271-environmental-stress-features
          path: |
            ops/environmental_stress_features.csv
            ops/stage271_environmental_stress_last_run.json
          if-no-files-found: error
          retention-days: 30
