name: Stage 80 Football-Data Top5 History

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/stage80_football_data_top5_9seasons.json'
      - 'scripts/stage80_football_data_history.py'
      - 'scripts/stage80_referee_research.py'
      - 'scripts/stage80_football_data_prematch_context.py'
      - 'scripts/stage80_prematch_factor_research.py'
      - 'scripts/stage80_prematch_factor_walkforward.py'
      - 'scripts/tests/test_stage80_football_data_history.py'
      - 'scripts/tests/test_stage80_football_data_prematch_context.py'
      - 'scripts/tests/test_stage80_prematch_factor_research.py'
      - 'scripts/tests/test_stage80_prematch_factor_walkforward.py'
      - 'scripts/tests/test_stage80_referee_research.py'
      - 'docs/stage80_football_data_history.md'
      - '.github/workflows/stage80-football-data-history.yml'
  push:
    branches: [main]
    paths:
      - 'config/stage80_football_data_top5_9seasons.json'
      - 'scripts/stage80_football_data_history.py'
      - 'scripts/stage80_referee_research.py'
      - 'scripts/stage80_football_data_prematch_context.py'
      - 'scripts/stage80_prematch_factor_research.py'
      - 'scripts/stage80_prematch_factor_walkforward.py'
      - 'scripts/tests/test_stage80_football_data_history.py'
      - 'scripts/tests/test_stage80_football_data_prematch_context.py'
      - 'scripts/tests/test_stage80_prematch_factor_research.py'
      - 'scripts/tests/test_stage80_prematch_factor_walkforward.py'
      - 'scripts/tests/test_stage80_referee_research.py'
      - 'docs/stage80_football_data_history.md'
      - '.github/workflows/stage80-football-data-history.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and unit test
        run: |
          python -m py_compile scripts/stage80_football_data_history.py scripts/stage80_referee_research.py scripts/stage80_football_data_prematch_context.py scripts/stage80_prematch_factor_research.py scripts/stage80_prematch_factor_walkforward.py
          python -m unittest scripts.tests.test_stage80_football_data_history scripts.tests.test_stage80_referee_research scripts.tests.test_stage80_football_data_prematch_context scripts.tests.test_stage80_prematch_factor_research scripts.tests.test_stage80_prematch_factor_walkforward -v
      - name: Download and normalize previous 9 completed Top5 seasons
        run: |
          mkdir -p source normalized
          python scripts/stage80_football_data_history.py \
            --config config/stage80_football_data_top5_9seasons.json \
            --download-dir source \
            --out-csv normalized/football_data_top5_9season_matches.csv \
            --meta-out normalized/stage80_football_data_history_meta.json \
            --fetch
      - name: Verify complete source matrix
        run: |
          python - <<'PY'
          import json
          p=json.load(open('normalized/stage80_football_data_history_meta.json',encoding='utf-8'))
          assert p['expected_source_files']==45, p
          assert p['present_source_files']==45, p
          assert p['missing_source_files']==0, p
          assert p['normalized_matches']==16111, p
          assert p['referee_rows']==3420, p
          assert p['referee_rows_by_league']=={'E0':3420}, p
          assert p['referee_coverage_pct']==21.23, p
          assert p['forward_validation_input'] is False, p
          print({
            'normalized_matches':p['normalized_matches'],
            'rows_by_season':p['rows_by_season'],
            'rows_by_league':p['rows_by_league'],
            'referee_rows':p['referee_rows'],
            'referee_coverage_pct':p['referee_coverage_pct'],
            'referee_rows_by_league':p['referee_rows_by_league'],
          })
          PY
      - name: Build explicit EPL referee historical slice
        run: |
          python - <<'PY'
          import csv
          source='normalized/football_data_top5_9season_matches.csv'
          target='normalized/football_data_epl_referee_matches.csv'
          with open(source,encoding='utf-8-sig',newline='') as src:
              reader=csv.DictReader(src)
              fields=list(reader.fieldnames or [])
              rows=[row for row in reader if (row.get('referee') or '').strip()]
          assert len(rows)==3420, len(rows)
          assert {row.get('league_code') for row in rows}=={'E0'}
          with open(target,'w',encoding='utf-8-sig',newline='') as dst:
              writer=csv.DictWriter(dst,fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print({'referee_rows':len(rows),'scope':'EPL_ONLY'})
          PY
      - name: Build EPL referee research projections
        run: |
          python scripts/stage80_referee_research.py \
            --source normalized/football_data_epl_referee_matches.csv \
            --profiles-out normalized/football_data_epl_referee_profiles.csv \
            --team-splits-out normalized/football_data_epl_referee_team_splits.csv \
            --meta-out normalized/stage80_referee_research_meta.json
      - name: Verify EPL referee research projections
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_referee_research_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_scope']=='EPL_ONLY', meta
          assert meta['source_rows']==3420, meta
          assert meta['profile_match_sum']==3420, meta
          assert meta['team_split_match_sum']==6840, meta
          assert meta['unique_referees']>0, meta
          assert meta['referee_team_pairs']>meta['unique_referees'], meta
          assert meta['penalties_available'] is False, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          with open('normalized/football_data_epl_referee_profiles.csv',encoding='utf-8-sig',newline='') as f:
              profiles=list(csv.DictReader(f))
          with open('normalized/football_data_epl_referee_team_splits.csv',encoding='utf-8-sig',newline='') as f:
              team_splits=list(csv.DictReader(f))
          assert sum(int(r['matches']) for r in profiles)==3420
          assert sum(int(r['matches']) for r in team_splits)==6840
          print(meta)
          PY
      - name: Build no-lookahead Top5 historical pre-match context
        run: |
          python scripts/stage80_football_data_prematch_context.py \
            --source normalized/football_data_top5_9season_matches.csv \
            --out-csv normalized/football_data_top5_prematch_context.csv \
            --meta-out normalized/stage80_football_data_prematch_context_meta.json
      - name: Verify no-lookahead historical pre-match context
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_football_data_prematch_context_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_rows']==16111, meta
          assert meta['output_rows']==16111, meta
          assert meta['unique_historical_match_ids']==16111, meta
          assert meta['league_codes']==['D1','E0','F1','I1','SP1'], meta
          assert meta['invalid_date_rows']==0, meta
          assert meta['duplicate_historical_match_ids']==0, meta
          assert meta['invalid_result_rows']==0, meta
          assert meta['same_day_results_excluded'] is True, meta
          assert meta['no_lookahead'] is True, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          with open('normalized/football_data_top5_prematch_context.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==16111, len(rows)
          assert all(r['no_lookahead']=='true' for r in rows)
          assert all(r['same_day_results_excluded']=='true' for r in rows)
          print({
              'rows':meta['output_rows'],
              'kickoff_time':meta['rows_with_kickoff_time'],
              'both_rest':meta['rows_with_both_rest'],
              'both_rank':meta['rows_with_both_pre_match_rank'],
              'both_full_last5':meta['rows_with_both_full_last5'],
              'both_full_last10':meta['rows_with_both_full_last10'],
          })
          PY
      - name: Build descriptive Top5 prematch factor research
        run: |
          python scripts/stage80_prematch_factor_research.py \
            --matches normalized/football_data_top5_9season_matches.csv \
            --context normalized/football_data_top5_prematch_context.csv \
            --out-csv normalized/football_data_top5_prematch_factor_research.csv \
            --stability-out normalized/football_data_top5_prematch_factor_stability.csv \
            --meta-out normalized/stage80_prematch_factor_research_meta.json
      - name: Verify prematch factor research governance
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_prematch_factor_research_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_rows']==16111, meta
          assert meta['context_rows']==16111, meta
          assert meta['joined_rows']==16111, meta
          assert meta['invalid_context_governance_rows']==0, meta
          assert meta['source_without_context']==0, meta
          assert meta['context_without_source']==0, meta
          assert meta['factor_names']==[
              'WEEKDAY','KICKOFF_LOCAL','SHORT_REST','REST_ADVANTAGE',
              'CONGESTION_7D_DIFF','TABLE_RANK_DIFF','FORM5_PPG_DIFF','VENUE_FORM5_PPG_DIFF'
          ], meta
          assert meta['factor_profile_rows']>0, meta
          assert meta['season_stability_rows']>0, meta
          assert meta['closing_1x2_matches']>0, meta
          assert meta['closing_total25_matches']>0, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          assert meta['creates_signal'] is False, meta
          with open('normalized/football_data_top5_prematch_factor_research.csv',encoding='utf-8-sig',newline='') as f:
              profiles=list(csv.DictReader(f))
          with open('normalized/football_data_top5_prematch_factor_stability.csv',encoding='utf-8-sig',newline='') as f:
              stability=list(csv.DictReader(f))
          assert len(profiles)==meta['factor_profile_rows']
          assert len(stability)==meta['season_stability_rows']
          assert all(r['research_only']=='true' for r in profiles)
          assert all(r['operational_betting_authority']=='false' for r in profiles)
          assert all(r['creates_signal']=='false' for r in profiles)
          print({
              'profiles':len(profiles),
              'stability':len(stability),
              'closing_1x2_matches':meta['closing_1x2_matches'],
              'closing_total25_matches':meta['closing_total25_matches'],
          })
          PY
      - name: Build walk-forward prematch factor validation research
        run: |
          python scripts/stage80_prematch_factor_walkforward.py \
            --matches normalized/football_data_top5_9season_matches.csv \
            --context normalized/football_data_top5_prematch_context.csv \
            --folds-out normalized/football_data_top5_prematch_factor_walkforward.csv \
            --summary-out normalized/football_data_top5_prematch_factor_walkforward_summary.csv \
            --meta-out normalized/stage80_prematch_factor_walkforward_meta.json
      - name: Verify walk-forward factor research governance
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_prematch_factor_walkforward_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_rows']==16111, meta
          assert meta['context_rows']==16111, meta
          assert meta['joined_rows']==16111, meta
          assert meta['invalid_context_governance_rows']==0, meta
          assert meta['source_without_context']==0, meta
          assert meta['context_without_source']==0, meta
          assert len(meta['season_labels'])==9, meta
          assert meta['targets']==['HOME','DRAW','AWAY','OVER25','UNDER25'], meta
          assert meta['fold_rows']>0, meta
          assert meta['summary_rows']>0, meta
          assert meta['sample_threshold_pass_folds']>0, meta
          assert meta['min_prior_seasons']==2, meta
          assert meta['min_train_market_matches']==100, meta
          assert meta['min_test_market_matches']==30, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          assert meta['creates_signal'] is False, meta
          assert meta['promotes_factor'] is False, meta
          assert meta['probability_mutation'] is False, meta
          assert meta['eligibility_mutation'] is False, meta
          assert meta['stake_changes'] is False, meta
          assert meta['forward_journal_mutation'] is False, meta
          with open('normalized/football_data_top5_prematch_factor_walkforward.csv',encoding='utf-8-sig',newline='') as f:
              folds=list(csv.DictReader(f))
          with open('normalized/football_data_top5_prematch_factor_walkforward_summary.csv',encoding='utf-8-sig',newline='') as f:
              summary=list(csv.DictReader(f))
          assert len(folds)==meta['fold_rows']
          assert len(summary)==meta['summary_rows']
          assert all(r['research_only']=='true' for r in folds)
          assert all(r['operational_betting_authority']=='false' for r in folds)
          assert all(r['creates_signal']=='false' for r in folds)
          assert all(r['promotes_factor']=='false' for r in summary)
          assert all(r['operational_betting_authority']=='false' for r in summary)
          print({
              'fold_rows':len(folds),
              'summary_rows':len(summary),
              'eligible_folds':meta['sample_threshold_pass_folds'],
          })
          PY
      - name: Source checksums
        run: sha256sum source/*.csv | sort > normalized/SHA256SUMS.source.txt
      - name: Upload normalized historical source artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-data-top5-9seasons
          path: normalized/
          retention-days: 90
      - name: Upload original source files
        uses: actions/upload-artifact@v4
        with:
          name: football-data-top5-9seasons-source
          path: source/
          retention-days: 90

  publish:
    name: Publish durable Football-Data research outputs
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: football-data-top5-9seasons
          path: normalized
      - name: Verify durable research outputs
        run: |
          python - <<'PY'
          import csv, json, os
          referee_meta=json.load(open('normalized/stage80_referee_research_meta.json',encoding='utf-8'))
          assert referee_meta['status']=='OK', referee_meta
          assert referee_meta['source_scope']=='EPL_ONLY', referee_meta
          assert referee_meta['source_rows']==3420, referee_meta
          assert referee_meta['unique_referees']==47, referee_meta
          assert referee_meta['referee_team_pairs']==897, referee_meta
          assert referee_meta['provider_calls']==0, referee_meta
          assert referee_meta['research_only'] is True, referee_meta
          assert referee_meta['operational_betting_authority'] is False, referee_meta
          with open('normalized/football_data_epl_referee_profiles.csv',encoding='utf-8-sig',newline='') as f:
              profiles=list(csv.DictReader(f))
          with open('normalized/football_data_epl_referee_team_splits.csv',encoding='utf-8-sig',newline='') as f:
              splits=list(csv.DictReader(f))
          assert len(profiles)==47, len(profiles)
          assert len(splits)==897, len(splits)

          context_meta=json.load(open('normalized/stage80_football_data_prematch_context_meta.json',encoding='utf-8'))
          assert context_meta['status']=='OK', context_meta
          assert context_meta['source_rows']==16111, context_meta
          assert context_meta['output_rows']==16111, context_meta
          assert context_meta['unique_historical_match_ids']==16111, context_meta
          assert context_meta['league_codes']==['D1','E0','F1','I1','SP1'], context_meta
          assert len(context_meta['season_labels'])==9, context_meta
          assert context_meta['invalid_date_rows']==0, context_meta
          assert context_meta['duplicate_historical_match_ids']==0, context_meta
          assert context_meta['invalid_result_rows']==0, context_meta
          assert context_meta['same_day_results_excluded'] is True, context_meta
          assert context_meta['no_lookahead'] is True, context_meta
          assert context_meta['provider_calls']==0, context_meta
          assert context_meta['research_only'] is True, context_meta
          assert context_meta['operational_betting_authority'] is False, context_meta
          with open('normalized/football_data_top5_prematch_context.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==16111, len(rows)
          assert len({r['historical_match_id'] for r in rows})==16111
          assert len({(r['league_code'],r['season_label']) for r in rows})==45
          assert all(r['no_lookahead']=='true' for r in rows)
          assert all(r['same_day_results_excluded']=='true' for r in rows)
          assert all(r['research_only']=='true' for r in rows)
          assert all(r['operational_betting_authority']=='false' for r in rows)
          size=os.path.getsize('normalized/football_data_top5_prematch_context.csv')
          assert size < 90_000_000, size
          print({'prematch_rows':len(rows),'league_seasons':45,'bytes':size})
          PY
      - name: Publish durable Football-Data research safely
        shell: bash
        run: |
          cp normalized/football_data_epl_referee_profiles.csv ops/epl_referee_profiles_research.csv
          cp normalized/football_data_epl_referee_team_splits.csv ops/epl_referee_team_splits_research.csv
          cp normalized/stage80_referee_research_meta.json ops/stage80_referee_research_last_run.json
          cp normalized/football_data_top5_prematch_context.csv ops/top5_prematch_context_research.csv
          cp normalized/stage80_football_data_prematch_context_meta.json ops/stage80_prematch_context_last_run.json
          cp normalized/football_data_top5_prematch_factor_research.csv ops/top5_prematch_factor_research.csv
          cp normalized/football_data_top5_prematch_factor_stability.csv ops/top5_prematch_factor_stability_research.csv
          cp normalized/stage80_prematch_factor_research_meta.json ops/stage80_prematch_factor_research_last_run.json
          cp normalized/football_data_top5_prematch_factor_walkforward.csv ops/top5_prematch_factor_walkforward_research.csv
          cp normalized/football_data_top5_prematch_factor_walkforward_summary.csv ops/top5_prematch_factor_walkforward_summary_research.csv
          cp normalized/stage80_prematch_factor_walkforward_meta.json ops/stage80_prematch_factor_walkforward_last_run.json
          git config user.name 'stage80-football-data-bot'
          git config user.email 'stage80-football-data-bot@users.noreply.github.com'
          git add ops/epl_referee_profiles_research.csv
          git add ops/epl_referee_team_splits_research.csv
          git add ops/stage80_referee_research_last_run.json
          git add ops/top5_prematch_context_research.csv
          git add ops/stage80_prematch_context_last_run.json
          git add ops/top5_prematch_factor_research.csv
          git add ops/top5_prematch_factor_stability_research.csv
          git add ops/stage80_prematch_factor_research_last_run.json
          git add ops/top5_prematch_factor_walkforward_research.csv
          git add ops/top5_prematch_factor_walkforward_summary_research.csv
          git add ops/stage80_prematch_factor_walkforward_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 Football-Data research archive update'
          python scripts/publish_operational_commit.py
