name: Stage 80 Football-Data Top5 History

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/stage80_football_data_top5_9seasons.json'
      - 'scripts/stage80_football_data_history.py'
      - 'scripts/stage80_referee_research.py'
      - 'scripts/stage80_football_data_prematch_context.py'
      - 'scripts/tests/test_stage80_football_data_history.py'
      - 'scripts/tests/test_stage80_football_data_prematch_context.py'
      - 'scripts/tests/test_stage80_referee_research.py'
      - 'docs/stage80_football_data_history.md'
      - '.github/workflows/stage80-football-data-history.yml'
  push:
    branches: [main]
    paths:
      - 'config/stage80_football_data_top5_9seasons.json'
      - 'scripts/stage80_football_data_history.py'
      - 'scripts/stage80_referee_research.py'
      - 'scripts/stage80_football_data_prematch_context.py'
      - 'scripts/tests/test_stage80_football_data_history.py'
      - 'scripts/tests/test_stage80_football_data_prematch_context.py'
      - 'scripts/tests/test_stage80_referee_research.py'
      - 'docs/stage80_football_data_history.md'
      - '.github/workflows/stage80-football-data-history.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and unit test
        run: |
          python -m py_compile scripts/stage80_football_data_history.py scripts/stage80_referee_research.py scripts/stage80_football_data_prematch_context.py
          python -m unittest scripts.tests.test_stage80_football_data_history scripts.tests.test_stage80_referee_research scripts.tests.test_stage80_football_data_prematch_context -v
      - name: Download and normalize previous 9 completed Top5 seasons
        run: |
          mkdir -p source normalized
          python scripts/stage80_football_data_history.py \
            --config config/stage80_football_data_top5_9seasons.json \
            --download-dir source \
            --out-csv normalized/football_data_top5_9season_matches.csv \
            --meta-out normalized/stage80_football_data_history_meta.json \
            --fetch
      - name: Verify complete source matrix
        run: |
          python - <<'PY'
          import json
          p=json.load(open('normalized/stage80_football_data_history_meta.json',encoding='utf-8'))
          assert p['expected_source_files']==45, p
          assert p['present_source_files']==45, p
          assert p['missing_source_files']==0, p
          assert p['normalized_matches']==16111, p
          assert p['referee_rows']==3420, p
          assert p['referee_rows_by_league']=={'E0':3420}, p
          assert p['referee_coverage_pct']==21.23, p
          assert p['forward_validation_input'] is False, p
          print({
            'normalized_matches':p['normalized_matches'],
            'rows_by_season':p['rows_by_season'],
            'rows_by_league':p['rows_by_league'],
            'referee_rows':p['referee_rows'],
            'referee_coverage_pct':p['referee_coverage_pct'],
            'referee_rows_by_league':p['referee_rows_by_league'],
          })
          PY
      - name: Build explicit EPL referee historical slice
        run: |
          python - <<'PY'
          import csv
          source='normalized/football_data_top5_9season_matches.csv'
          target='normalized/football_data_epl_referee_matches.csv'
          with open(source,encoding='utf-8-sig',newline='') as src:
              reader=csv.DictReader(src)
              fields=list(reader.fieldnames or [])
              rows=[row for row in reader if (row.get('referee') or '').strip()]
          assert len(rows)==3420, len(rows)
          assert {row.get('league_code') for row in rows}=={'E0'}
          with open(target,'w',encoding='utf-8-sig',newline='') as dst:
              writer=csv.DictWriter(dst,fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print({'referee_rows':len(rows),'scope':'EPL_ONLY'})
          PY
      - name: Build EPL referee research projections
        run: |
          python scripts/stage80_referee_research.py \
            --source normalized/football_data_epl_referee_matches.csv \
            --profiles-out normalized/football_data_epl_referee_profiles.csv \
            --team-splits-out normalized/football_data_epl_referee_team_splits.csv \
            --meta-out normalized/stage80_referee_research_meta.json
      - name: Verify EPL referee research projections
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_referee_research_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_scope']=='EPL_ONLY', meta
          assert meta['source_rows']==3420, meta
          assert meta['profile_match_sum']==3420, meta
          assert meta['team_split_match_sum']==6840, meta
          assert meta['unique_referees']>0, meta
          assert meta['referee_team_pairs']>meta['unique_referees'], meta
          assert meta['penalties_available'] is False, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          with open('normalized/football_data_epl_referee_profiles.csv',encoding='utf-8-sig',newline='') as f:
              profiles=list(csv.DictReader(f))
          with open('normalized/football_data_epl_referee_team_splits.csv',encoding='utf-8-sig',newline='') as f:
              team_splits=list(csv.DictReader(f))
          assert sum(int(r['matches']) for r in profiles)==3420
          assert sum(int(r['matches']) for r in team_splits)==6840
          print(meta)
          PY
      - name: Build no-lookahead Top5 historical pre-match context
        run: |
          python scripts/stage80_football_data_prematch_context.py \
            --source normalized/football_data_top5_9season_matches.csv \
            --out-csv normalized/football_data_top5_prematch_context.csv \
            --meta-out normalized/stage80_football_data_prematch_context_meta.json
      - name: Verify no-lookahead historical pre-match context
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_football_data_prematch_context_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_rows']==16111, meta
          assert meta['output_rows']==16111, meta
          assert meta['unique_historical_match_ids']==16111, meta
          assert meta['league_codes']==['D1','E0','F1','I1','SP1'], meta
          assert meta['invalid_date_rows']==0, meta
          assert meta['duplicate_historical_match_ids']==0, meta
          assert meta['invalid_result_rows']==0, meta
          assert meta['same_day_results_excluded'] is True, meta
          assert meta['no_lookahead'] is True, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          with open('normalized/football_data_top5_prematch_context.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==16111, len(rows)
          assert all(r['no_lookahead']=='true' for r in rows)
          assert all(r['same_day_results_excluded']=='true' for r in rows)
          print({
              'rows':meta['output_rows'],
              'kickoff_time':meta['rows_with_kickoff_time'],
              'both_rest':meta['rows_with_both_rest'],
              'both_rank':meta['rows_with_both_pre_match_rank'],
              'both_full_last5':meta['rows_with_both_full_last5'],
              'both_full_last10':meta['rows_with_both_full_last10'],
          })
          PY
      - name: Source checksums
        run: sha256sum source/*.csv | sort > normalized/SHA256SUMS.source.txt
      - name: Upload normalized historical source artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-data-top5-9seasons
          path: normalized/
          retention-days: 90
      - name: Upload original source files
        uses: actions/upload-artifact@v4
        with:
          name: football-data-top5-9seasons-source
          path: source/
          retention-days: 90

  publish:
    name: Publish durable referee research outputs
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: football-data-top5-9seasons
          path: normalized
      - name: Verify compact referee outputs
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('normalized/stage80_referee_research_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_scope']=='EPL_ONLY', meta
          assert meta['source_rows']==3420, meta
          assert meta['unique_referees']==47, meta
          assert meta['referee_team_pairs']==897, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          with open('normalized/football_data_epl_referee_profiles.csv',encoding='utf-8-sig',newline='') as f:
              profiles=list(csv.DictReader(f))
          with open('normalized/football_data_epl_referee_team_splits.csv',encoding='utf-8-sig',newline='') as f:
              splits=list(csv.DictReader(f))
          assert len(profiles)==47, len(profiles)
          assert len(splits)==897, len(splits)
          PY
      - name: Publish compact referee research safely
        shell: bash
        run: |
          cp normalized/football_data_epl_referee_profiles.csv ops/epl_referee_profiles_research.csv
          cp normalized/football_data_epl_referee_team_splits.csv ops/epl_referee_team_splits_research.csv
          cp normalized/stage80_referee_research_meta.json ops/stage80_referee_research_last_run.json
          git config user.name 'stage80-referee-bot'
          git config user.email 'stage80-referee-bot@users.noreply.github.com'
          git add ops/epl_referee_profiles_research.csv
          git add ops/epl_referee_team_splits_research.csv
          git add ops/stage80_referee_research_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 EPL referee research archive update'
          python scripts/publish_operational_commit.py
