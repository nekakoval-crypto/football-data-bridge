name: Stage 71F European Handicap Capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
      API_FOOTBALL_SEASON: '2026'
      STAGE71F_USER_BOOKMAKER: 'Marathonbet'
      STAGE71F_OPEN_HORIZON_H: '336'
      STAGE71F_TRACK_HORIZON_H: '72'
      STAGE71F_NEXT_PER_LEAGUE: '10'
      STAGE71F_EH_BET_ID: '9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture European Handicap market data
        run: python scripts/stage71f_european_handicap_capture.py
      - name: Show summary
        run: cat ops/stage71f_last_run.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage71f-european-handicap-diagnostic
          path: |
            ops/stage71f_eh_openers.csv
            ops/stage71f_eh_snapshots.csv
            ops/stage71f_eh_closes.csv
            ops/stage71f_last_run.json
          if-no-files-found: ignore
          retention-days: 7
