name: Stage 56 Weather and XI Rotation Context

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

  pull_request:
    paths:
      - 'scripts/stage56_weather_rotation.py'
      - 'scripts/stage56_latest_view.py'
      - 'scripts/tests/test_stage56_environment_contract.py'
      - '.github/workflows/stage56-weather-rotation.yml'

  push:
    branches:
      - main
    paths:
      - 'scripts/stage56_weather_rotation.py'
      - 'scripts/stage56_latest_view.py'
      - '.github/workflows/stage56-weather-rotation.yml'

permissions:
  contents: write

concurrency:
  group: pbk-api-football-global
  cancel-in-progress: false

env:
  PBK_GLOBAL_QUOTA_REQUIRED: '1'
  API_FOOTBALL_GLOBAL_NORMAL_CEILING: '6800'
  API_FOOTBALL_GLOBAL_ABSOLUTE_CEILING: '7350'
  PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
  PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
  PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
  PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
  PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
  PBK_RAW_ARCHIVE_S3_REGION: auto
  API_FOOTBALL_QUOTA_CLASS: NORMAL

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile environment layer
        run: |
          python -m py_compile             scripts/stage56_weather_rotation.py             scripts/stage56_latest_view.py             scripts/tests/test_stage56_environment_contract.py scripts/pbk_weather_evidence_gate.py

      - name: Environment contract tests
        run: |
          python -m unittest             scripts.tests.test_stage56_environment_contract             -v

  enrich:
    needs: validate
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage 56 weather and rotation
        run: |
          # PBK495_FAIL_CLOSED
          set -e
          for attempt in 1 2 3; do
            echo "Stage 56 attempt ${attempt}/3"
            python scripts/pbk16_capture_universe_adapter_v1.py
            # PBK494_CONTEXT_BEFORE_WEATHER
            python scripts/pbk_point14_current_context_adapter_v1.py
            if python scripts/stage56_weather_rotation.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Stage 56 failed after 3 attempts.'
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Rebuild compact Stage 56 view
        run: python scripts/stage56_latest_view.py

      - name: Show Stage 56 summary
        run: |
          echo '--- stage56_last_run.json ---'
          cat ops/stage56_last_run.json
          echo '--- stage56_latest.csv ---'
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('ops/stage56_latest.csv')
          if p.exists():
              with p.open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              print('rows=',len(rows))
              for r in rows:
                  print(
                      r['home_team'], '-', r['away_team'],
                      'weather=', r['weather_snapshot_type'],
                      'temp=', r['temperature_c'],
                      'rainP=', r['precipitation_probability_pct'],
                      'wind=', r['wind_speed_10m_kmh'],
                      'gust=', r['wind_gusts_10m_kmh'],
                      'rotation_verified=', r['rotation_verified'],
                      'home_changed=', r['home_changed_starters'],
                      'away_changed=', r['away_changed_starters']
                  )
          PY

      - name: Commit Stage 56 operational files safely
        run: |
          git config user.name 'stage56-bot'
          git config user.email 'stage56-bot@users.noreply.github.com'
          # PBK497_CAPTURE_PERSISTENCE
          git add ops/pbk16_capture_universe.csv \
                  ops/context_latest.csv \
                  ops/weather_snapshots.csv \
                  ops/rotation_snapshots.csv \
                  ops/stage56_latest.csv \
                  ops/stage56_last_run.json
          if git diff --cached --quiet; then
            echo 'No Stage 56 operational changes to commit.'
            exit 0
          fi
          git commit -m 'Stage 56 weather rotation update'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Concurrent push detected; retry ${attempt}/3"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1

      - name: Upload Stage 56 snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage56-weather-rotation
          path: |
            ops/pbk16_capture_universe.csv
            ops/context_latest.csv
            ops/weather_snapshots.csv
            ops/rotation_snapshots.csv
            ops/stage56_latest.csv
            ops/stage56_last_run.json
          if-no-files-found: ignore
          retention-days: 30

      # PBK548_FAILURE_EVIDENCE
      - name: Upload Stage 56 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage56-weather-failure-evidence
          path: |
            ops/stage56_last_run.json
            ops/pbk16_capture_universe.csv
            ops/context_latest.csv
            ops/weather_snapshots.csv
            ops/rotation_snapshots.csv
            ops/stage56_latest.csv
          if-no-files-found: warn
          retention-days: 30
