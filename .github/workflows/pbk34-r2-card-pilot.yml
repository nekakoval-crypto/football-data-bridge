name: PBK34 R2 Card Pilot

on:
  workflow_dispatch:
    inputs:
      fixture_ids:
        description: "JSON array of exactly 12 fixture IDs"
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_PREFIX: ${{ secrets.PBK_RAW_ARCHIVE_S3_PREFIX }}
      PBK_RAW_ARCHIVE_S3_REGION: ${{ secrets.PBK_RAW_ARCHIVE_S3_REGION }}
      PBK34_PILOT_FIXTURE_IDS: ${{ inputs.fixture_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive reader dependency
        run: python -m pip install boto3
      - name: Read existing R2 evidence only
        run: python scripts/pbk34_r2_card_pilot_310.py
      - name: Upload archive pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbk34-r2-card-pilot-310
          path: ops/pbk34_r2_card_pilot_310_result.json
          if-no-files-found: warn
