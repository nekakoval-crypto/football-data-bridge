name: Stage 80 PBK14 International Window Market Walkforward

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Stage 80 PBK14 International Window Market Research']
    types: [completed]
  pull_request:
    paths:
      - 'scripts/stage80_pbk14_international_window_market_walkforward.py'
      - 'scripts/tests/test_stage80_pbk14_international_window_market_walkforward.py'
      - '.github/workflows/stage80-pbk14-international-window-market-walkforward.yml'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_archive_readiness.py'
      - 'scripts/tests/test_stage80_pbk14_international_window_market_walkforward_readiness.py'
      - '.github/workflows/stage80-archive-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage80_pbk14_international_window_market_walkforward.py'
      - 'scripts/tests/test_stage80_pbk14_international_window_market_walkforward.py'
      - '.github/workflows/stage80-pbk14-international-window-market-walkforward.yml'
      - 'ops/pbk14_international_window_market_join_research.csv'
      - 'ops/stage80_pbk14_international_window_market_join_last_run.json'
      - 'ops/pbk14_international_window_market_walkforward_research.csv'
      - 'ops/pbk14_international_window_market_walkforward_summary_research.csv'
      - 'ops/stage80_pbk14_international_window_market_walkforward_last_run.json'

concurrency:
  group: stage80-pbk14-international-window-market-walkforward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and provider-free tests
        run: |
          python -m py_compile scripts/stage80_pbk14_international_window_market_walkforward.py
          python -m unittest scripts.tests.test_stage80_pbk14_international_window_market_walkforward -v
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated international-window walk-forward outputs are forbidden in feature PR.' >&2
            exit 1
          fi

  build:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strict international-window walk-forward
        run: |
          mkdir -p research
          python scripts/stage80_pbk14_international_window_market_walkforward.py \
            --source ops/pbk14_international_window_market_join_research.csv \
            --folds-out research/pbk14_international_window_market_walkforward_research.csv \
            --summary-out research/pbk14_international_window_market_walkforward_summary_research.csv \
            --meta-out research/stage80_pbk14_international_window_market_walkforward_meta.json
      - name: Verify temporal integrity and governance
        run: |
          python - <<'PY'
          import csv, json
          join=json.load(open('ops/stage80_pbk14_international_window_market_join_last_run.json',encoding='utf-8'))
          meta=json.load(open('research/stage80_pbk14_international_window_market_walkforward_meta.json',encoding='utf-8'))
          assert meta['status']=='OK', meta
          assert meta['source_rows']==join['joined_rows'], (meta,join)
          assert meta['valid_research_rows']==join['joined_rows'], (meta,join)
          assert meta['invalid_governance_or_result_rows']==0, meta
          assert meta['season_starts']==['2017','2018','2019','2020','2021','2022','2023','2024','2025'], meta
          assert meta['targets']==['HOME','DRAW','AWAY','OVER25','UNDER25'], meta
          assert set(meta['factor_names'])=={
              'INTL_BEFORE_72H','INTL_BEFORE_96H','INTL_BEFORE_7D',
              'INTL_AFTER_72H','INTL_AFTER_96H','INTL_AFTER_7D',
              'FIRST_DOMESTIC_AFTER_SIDE','WINDOW_RELATION','WINDOW_MAX_MATCHES',
          }, meta
          assert meta['fold_rows']>0 and meta['summary_rows']>0, meta
          assert meta['sample_threshold_pass_folds']>0, meta
          assert meta['min_prior_seasons']==2, meta
          assert meta['min_train_market_matches']==100, meta
          assert meta['min_test_market_matches']==30, meta
          assert meta['window_reference_contract']=='NEAREST_WINDOW_RELATION_GATED_V2', meta
          assert meta['player_level_international_status']=='UNVERIFIED', meta
          assert meta['player_callup_inferred'] is False, meta
          assert meta['player_travel_inferred'] is False, meta
          assert meta['player_appearance_inferred'] is False, meta
          assert meta['final_tournaments_included'] is False, meta
          assert meta['non_uefa_only_windows_included'] is False, meta
          assert meta['calendar_level_only'] is True, meta
          assert meta['as_known_calendar_reference'] is True, meta
          assert meta['no_match_result_dependency'] is True, meta
          assert meta['no_lookahead'] is True, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          assert meta['creates_signal'] is False, meta
          assert meta['promotes_factor'] is False, meta
          with open('research/pbk14_international_window_market_walkforward_research.csv',encoding='utf-8-sig',newline='') as f:
              folds=list(csv.DictReader(f))
          with open('research/pbk14_international_window_market_walkforward_summary_research.csv',encoding='utf-8-sig',newline='') as f:
              summary=list(csv.DictReader(f))
          assert len(folds)==meta['fold_rows']
          assert len(summary)==meta['summary_rows']
          assert all(int(x['train_last_season']) < int(x['test_season']) for x in folds)
          assert all(x['promotes_factor']=='false' for x in folds)
          assert all(x['operational_betting_authority']=='false' for x in folds)
          assert all(x['promotes_factor']=='false' for x in summary)
          print({
            'folds':meta['fold_rows'],
            'summaries':meta['summary_rows'],
            'qualified_folds':meta['sample_threshold_pass_folds'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pbk14-international-window-market-walkforward
          path: research/
          retention-days: 90

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: pbk14-international-window-market-walkforward
          path: research
      - name: Publish walk-forward research
        shell: bash
        run: |
          cp research/pbk14_international_window_market_walkforward_research.csv ops/pbk14_international_window_market_walkforward_research.csv
          cp research/pbk14_international_window_market_walkforward_summary_research.csv ops/pbk14_international_window_market_walkforward_summary_research.csv
          cp research/stage80_pbk14_international_window_market_walkforward_meta.json ops/stage80_pbk14_international_window_market_walkforward_last_run.json
          git config user.name 'stage80-pbk14-international-window-wf-bot'
          git config user.email 'stage80-pbk14-international-window-wf-bot@users.noreply.github.com'
          git add ops/pbk14_international_window_market_walkforward_research.csv
          git add ops/pbk14_international_window_market_walkforward_summary_research.csv
          git add ops/stage80_pbk14_international_window_market_walkforward_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 PBK14 international-window market walk-forward update'
          python scripts/publish_operational_commit.py
