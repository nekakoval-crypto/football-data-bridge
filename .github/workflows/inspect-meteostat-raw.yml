name: inspect-meteostat-raw

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-meteostat-raw.yml']
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect known Meteostat station file
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL 'https://data.meteostat.net/hourly/2024/10637.csv.gz' -o sample.csv.gz
          gzip -dc sample.csv.gz | head -n 6 > sample.txt
          cat sample.txt
      - uses: actions/upload-artifact@v4
        with:
          name: meteostat-raw-sample
          path: sample.txt
          retention-days: 1
