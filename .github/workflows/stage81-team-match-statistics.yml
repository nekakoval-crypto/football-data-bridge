name: Stage 81 Team Match Statistics Capture

on:
  workflow_dispatch:
  schedule:
    # Low priority. Runs through the shared Stage71 budget and preserves
    # LIVE/current-round/standings + Stage77 player-stat reserve.
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'scripts/stage81_team_match_statistics_capture.py'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_archive_readiness.py'
      - 'scripts/tests/test_stage81_team_match_statistics_capture.py'
      - 'scripts/tests/test_stage80_stage81_team_stats_readiness.py'
      - '.github/workflows/stage81-team-match-statistics.yml'
  push:
    paths:
      - 'scripts/stage81_team_match_statistics_capture.py'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_archive_readiness.py'
      - 'scripts/tests/test_stage81_team_match_statistics_capture.py'
      - 'scripts/tests/test_stage80_stage81_team_stats_readiness.py'
      - '.github/workflows/stage81-team-match-statistics.yml'

permissions:
  contents: read

concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Stage81
        run: |
          python -m py_compile scripts/stage81_team_match_statistics_capture.py
          python -m py_compile scripts/stage80_archive_manifest.py
          python -m py_compile scripts/stage80_archive_readiness.py
          python -m py_compile scripts/tests/test_stage81_team_match_statistics_capture.py
          python -m py_compile scripts/tests/test_stage80_stage81_team_stats_readiness.py

      - name: Provider-free Stage81 tests
        run: |
          python -m unittest scripts.tests.test_stage81_team_match_statistics_capture -v
          python -m unittest scripts.tests.test_stage80_stage81_team_stats_readiness -v

      - name: Provider isolation
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports' scripts/stage81_team_match_statistics_capture.py; then
            echo 'Stage81 must reach API-Football only through the shared broker/backend.' >&2
            exit 1
          fi

      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated ops files are forbidden in the Stage81 feature PR.' >&2
            exit 1
          fi

  capture:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: ops

      # Stage81 is deliberately below LIVE/current-round/standings and Stage77.
      STAGE81_MAX_API_CALLS: '12'
      STAGE81_MAX_FIXTURES_PER_RUN: '12'
      STAGE71_MAX_DAILY_API_CALLS: '7000'
      STAGE81_STANDINGS_RESERVE_CALLS: '16'
      STAGE81_PLAYER_STATS_RESERVE_CALLS: '4'
      STAGE81_SAFETY_RESERVE_CALLS: '8'
      STAGE81_CURRENT_ROUND_CALLS_PER_RUN: '32'

      # Raw Stage80 archive remains disabled until real durable mounted storage
      # exists. Do not point this at an ephemeral GitHub Actions directory.
      API_FOOTBALL_ARCHIVE_DIR: ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture finished-fixture team statistics
        run: python scripts/stage81_team_match_statistics_capture.py

      - name: Publish Stage81 operational files safely
        shell: bash
        run: |
          git config user.name 'stage81-bot'
          git config user.email 'stage81-bot@users.noreply.github.com'

          git add ops/stage81_last_run.json ops/stage71_observation_state.json

          if [ -f ops/stage81_team_stats_backlog.csv ]; then
            git add ops/stage81_team_stats_backlog.csv
          fi

          if [ -f ops/team_match_statistics.csv ]; then
            git add ops/team_match_statistics.csv
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Stage 81 team match statistics capture update'
          python scripts/publish_operational_commit.py
