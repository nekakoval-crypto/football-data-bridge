name: Stage 71 Live Snapshot
on:
  workflow_dispatch:
  schedule:
    # 48 cycles/day; 30-minute cadence leaves the shared daily budget headroom.
    - cron: '*/30 * * * *'
  pull_request:
    paths:
      - 'scripts/stage71_live_snapshot.py'
      - 'scripts/stage72_build_data_layer.py'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_stage71_live_snapshot.py'
      - '.github/workflows/stage71-live-snapshot.yml'
permissions:
  contents: read
concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s scripts/tests -p 'test_stage71_live_snapshot.py' -v
  refresh:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions: {contents: write}
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: ops
      STAGE71_MAX_API_CALLS: '60'
      STAGE71_MAX_DAILY_API_CALLS: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/stage71_live_snapshot.py
      - name: Publish live overlay
        run: |
          git config user.name 'stage71-bot'
          git config user.email 'stage71-bot@users.noreply.github.com'
          git add ops/live_fixture_overlay.csv ops/live_fixture_overlay_last_run.json ops/stage71_observation_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 71 live fixture snapshot update'
          git pull --rebase origin main
          git push origin main
