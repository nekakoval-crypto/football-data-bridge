name: Stage 71H Core Market Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    paths:
      - 'scripts/stage71h_core_market_readiness.py'
      - 'research/stage71h_core_market_data_readiness_policy_2026-09-11.md'
      - 'config/pbk_core_market_registry.json'
      - '.github/workflows/stage71h-core-market-readiness.yml'

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core-market readiness board
        run: python scripts/stage71h_core_market_readiness.py
      - name: Show readiness summary
        run: |
          cat ops/stage71h_last_run.json
          cat ops/core_market_readiness.md
      - name: Commit readiness outputs safely
        run: |
          git config user.name 'stage71h-bot'
          git config user.email 'stage71h-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/stage71h_core_market_readiness.py
            git add ops/core_market_readiness.json ops/core_market_readiness.md ops/stage71h_last_run.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Stage71H core market readiness update'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: stage71h-core-market-readiness
          path: |
            ops/core_market_readiness.json
            ops/core_market_readiness.md
            ops/stage71h_last_run.json
          retention-days: 30
