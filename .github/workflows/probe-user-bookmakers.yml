name: Probe User Bookmakers

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_user_bookmakers.py'
      - '.github/workflows/probe-user-bookmakers.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe bookmaker catalogue
        run: python scripts/probe_user_bookmakers.py
      - name: Commit result
        run: |
          git config user.name 'bookmaker-probe-bot'
          git config user.email 'bookmaker-probe-bot@users.noreply.github.com'
          git add ops/bookmaker_probe.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Update bookmaker probe result'
            git push
          fi
