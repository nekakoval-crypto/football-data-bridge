name: Stage 68 Exposure Map

on:
  workflow_dispatch:
  schedule:
    - cron: '57 * * * *'
  push:
    paths:
      - 'scripts/stage68_exposure_map.py'
      - '.github/workflows/stage68-exposure-map.yml'

permissions:
  contents: write

jobs:
  exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Stage 68 exposure map
        run: python scripts/stage68_exposure_map.py

      - name: Show Stage 68 summary
        run: |
          cat ops/stage68_last_run.json
          echo '--- exposure_summary.md ---'
          cat ops/exposure_summary.md

      - name: Commit Stage 68 operational files
        run: |
          git config user.name 'stage68-bot'
          git config user.email 'stage68-bot@users.noreply.github.com'
          git add -A ops
          if git diff --cached --quiet; then
            echo 'No Stage 68 changes to commit.'
          else
            git commit -m 'Stage 68 exposure map update'
            git push
          fi

      - name: Upload Stage 68 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage68-exposure-map
          path: |
            ops/exposure_map.csv
            ops/exposure_summary.json
            ops/exposure_summary.md
            ops/stage68_last_run.json
          if-no-files-found: error
          retention-days: 30
