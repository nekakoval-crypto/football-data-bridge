name: fetch-transfermarkt-csv

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-transfermarkt-csv.yml'
      - 'scripts/stage80_transfer_source_audit.py'
      - 'scripts/tests/test_stage80_transfer_source_audit.py'
      - 'scripts/stage80_transfer_entity_mapping.py'
      - 'scripts/tests/test_stage80_transfer_entity_mapping.py'
  pull_request:
    paths:
      - '.github/workflows/fetch-transfermarkt-csv.yml'
      - 'scripts/stage80_transfer_source_audit.py'
      - 'scripts/tests/test_stage80_transfer_source_audit.py'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test transfer source audit and entity mapping
        run: |
          python -m unittest scripts.tests.test_stage80_transfer_source_audit -v
          python -m unittest scripts.tests.test_stage80_transfer_entity_mapping -v
      - name: Download Transfermarkt CSV.GZ tables
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data'
          mkdir -p core heavy
          for f in competitions.csv.gz clubs.csv.gz games.csv.gz players.csv.gz player_valuations.csv.gz transfers.csv.gz; do
            curl -fL --retry 5 --retry-delay 3 "$BASE/$f" -o "core/$f"
          done
          for f in appearances.csv.gz game_lineups.csv.gz game_events.csv.gz club_games.csv.gz; do
            curl -fL --retry 5 --retry-delay 3 "$BASE/$f" -o "heavy/$f"
          done
          curl -fL --retry 5 --retry-delay 3 "$BASE/dataset-metadata.json" -o dataset-metadata.json
          ls -lh core heavy dataset-metadata.json
          sha256sum core/* heavy/* dataset-metadata.json | tee SHA256SUMS.txt

      - name: Validate transfer source schema
        run: python scripts/stage80_transfer_source_audit.py dataset-metadata.json

      - name: Build conservative PBK transfer mapping artifact
        run: |
          mkdir -p mapping
          python scripts/stage80_transfer_entity_mapping.py \
            --pbk ops/historical_players.csv \
            --players core/players.csv.gz \
            --transfers core/transfers.csv.gz \
            --mapping-out mapping/pbk_transfermarkt_player_mapping_candidates.csv \
            --transfers-out mapping/pbk_transfer_history_exact_mapped.csv \
            --meta-out mapping/stage80_transfer_mapping_meta.json

      - name: Upload transfer mapping artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-pbk-mapping
          path: mapping/
          retention-days: 30

      - name: Upload core tables
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-core-csv
          path: |
            core/
            dataset-metadata.json
          compression-level: 0
          retention-days: 30

      - name: Upload heavy tables
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-heavy-csv
          path: heavy/
          compression-level: 0
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-checksums
          path: SHA256SUMS.txt
          retention-days: 30
