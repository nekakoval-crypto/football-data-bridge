name: Stage 80 International Duty PBK16 Club Identity

on:
  pull_request:
    paths:
      - 'scripts/stage80_international_duty_pbk16_club_identity.py'
      - 'scripts/tests/test_stage80_international_duty_pbk16_club_identity.py'
      - 'ops/team_match_statistics.csv'
      - '.github/workflows/stage80-international-duty-pbk16-club-identity.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage80_international_duty_pbk16_club_identity.py'
      - 'scripts/tests/test_stage80_international_duty_pbk16_club_identity.py'
      - '.github/workflows/stage80-international-duty-pbk16-club-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test conservative PBK16 club identity
        run: |
          python -m py_compile scripts/stage80_international_duty_pbk16_club_identity.py
          python -m unittest scripts.tests.test_stage80_international_duty_pbk16_club_identity -v
      - name: Provider isolation
        run: |
          ! grep -Eq 'requests|httpx|urllib|api_get|curl' scripts/stage80_international_duty_pbk16_club_identity.py
      - name: Materialize on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python scripts/stage80_international_duty_pbk16_club_identity.py
          git config user.name 'stage80-bot'
          git config user.email 'stage80-bot@users.noreply.github.com'
          git add ops/international_duty_player_pbk16_club_identity.csv
          git add ops/stage80_international_duty_pbk16_club_identity_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 international-duty PBK16 club identity update'
          python scripts/publish_operational_commit.py
