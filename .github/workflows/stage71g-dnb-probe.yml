name: Stage 71G DNB Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stage71g_dnb_probe.py'
      - '.github/workflows/stage71g-dnb-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: ops
      API_FOOTBALL_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe full-time AH=0 market
        run: python scripts/stage71g_dnb_probe.py
      - name: Show probe
        run: cat ops/stage71g_dnb_probe.json
      - name: Commit probe
        run: |
          git config user.name 'stage71g-bot'
          git config user.email 'stage71g-bot@users.noreply.github.com'
          git add ops/stage71g_dnb_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage71G DNB safe probe update'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
