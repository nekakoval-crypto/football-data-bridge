name: Stage 80 Historical Lineup Injury Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage80_historical_lineup_injury_probe.py'
      - 'scripts/tests/test_stage80_historical_lineup_injury_probe.py'
      - '.github/workflows/stage80-historical-lineup-injury-probe.yml'

permissions:
  contents: read

concurrency:
  group: stage80-historical-lineup-injury-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and provider-free tests
        run: |
          python -m py_compile scripts/stage80_historical_lineup_injury_probe.py
          python -m unittest scripts.tests.test_stage80_historical_lineup_injury_probe -v
      - name: Provider isolation
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports' scripts/stage80_historical_lineup_injury_probe.py; then
            echo 'Historical lineup/injury probe must reach API-Football only through the shared broker/backend.' >&2
            exit 1
          fi
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated probe outputs are forbidden in the feature PR.' >&2
            exit 1
          fi

  probe:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto
      OPS_DIR: ops
      STAGE71_MAX_DAILY_API_CALLS: '7000'
      STAGE80_HISTORICAL_PROBE_EXPECTED_LEAGUES: '16'
      STAGE80_HISTORICAL_PROBE_FIXTURES_PER_LEAGUE: '8'
      STAGE80_HISTORICAL_PROBE_SEASONS_PER_LEAGUE: '4'
      STAGE80_HISTORICAL_PROBE_MAX_API_CALLS: '256'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raw archive S3 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Run bounded PBK16 historical availability probe
        run: python scripts/stage80_historical_lineup_injury_probe.py
      - name: Show probe telemetry
        run: cat ops/stage80_historical_lineup_injury_probe_last_run.json
      - name: Upload probe telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage80-historical-lineup-injury-probe
          path: |
            ops/stage80_historical_lineup_injury_probe.csv
            ops/stage80_historical_lineup_injury_probe_last_run.json
          if-no-files-found: error
          retention-days: 30
