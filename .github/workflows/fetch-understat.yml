name: fetch-understat-player-data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-understat.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone Understat aggregate dataset
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/vibedatascience/understat_players_aggregated.git understat
          find understat -maxdepth 3 -type f | sort | sed -n '1,200p'
      - name: Upload Understat repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: understat-player-data
          path: understat/
          compression-level: 0
          retention-days: 7
