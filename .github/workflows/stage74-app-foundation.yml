name: Stage 74 App Foundation

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'app/**'
      - 'scripts/stage66_append_market_cards.py'
      - 'scripts/market_research_inventory.py'
      - 'scripts/tests/test_market_cards.py'
      - 'deploy/**'
      - 'docs/stage74_*.md'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_challenger_observations_api.py'
      - 'scripts/stage74_app_api.py'
      - 'scripts/stage75_probability_value.py'
      - 'scripts/stage72_build_data_layer.py'
      - '.github/workflows/stage74-app-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'
      STAGE72_DB_PATH: 'build/pbk_unified.sqlite'
      PBK_DB_PATH: 'build/pbk_unified.sqlite'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend syntax and manifest
        run: |
          node --check app/app.js
          node --check app/filters.js
          node --check app/install.js
          node --check app/runtime.js
          node --check app/push.js
          node --check app/probability.js
          node --check app/challengers.js
          node --check app/markets.js
          node --test app/tests/*.test.mjs
          node --check app/sw.js
          python -m json.tool app/manifest.webmanifest >/dev/null
          test -s app/index.html
          test -s app/app.css
          test -s app/filters.css
          test -s app/install.css
          test -s app/runtime.css
          test -s app/push.css
          test -s app/probability.css
          test -s app/install.js
          test -s app/runtime.js
          test -s app/push.js
          test -s app/probability.js
          test -s app/icon.svg
          test -s app/sw.js
          grep -q 'notification-badge' app/index.html
          grep -q 'data-safety-banner' app/index.html
          grep -q 'install-app' app/index.html
          grep -q 'runtime-panel' app/index.html
          grep -q 'push-toggle' app/index.html
          grep -q 'probability-today' app/index.html
          grep -q 'probability-stats-detail' app/index.html
          grep -q '/runtime.js' app/index.html
          grep -q '/install.js' app/index.html
          grep -q '/push.js' app/index.html
          grep -q '/probability.js' app/index.html
          grep -q '/v1/notifications' app/app.js
          grep -q '/api/v1/runtime' app/runtime.js
          grep -q '/v1/push/subscribe' app/push.js
          grep -q '/api/v1/performance' app/probability.js
          grep -q 'applyFreshnessGuard' app/app.js
          grep -q "pbk-shell-v9" app/sw.js
          grep -q "beforeinstallprompt" app/install.js
          grep -q "addEventListener('push'" app/sw.js
          grep -q 'probability.js' app/sw.js
          grep -q 'push.js' app/sw.js
          grep -q 'runtime.js' app/sw.js
          grep -q 'icon.svg' app/manifest.webmanifest
          ! grep -q "caches.put.*api" app/sw.js
      - name: Validate deployment scripts
        run: |
          bash -n deploy/sync_data.sh
          bash -n deploy/bootstrap_server.sh
          bash -n deploy/apply_release.sh
          bash -n deploy/upgrade_server.sh
          bash -n deploy/harden_server.sh
          bash -n deploy/setup_push.sh
          python -m py_compile deploy/push_dispatch.py
          test -s deploy/requirements-push.txt
          test -s deploy/pbk-release.service
          test -s deploy/pbk-release.timer
          test -s deploy/pbk-push.service
          test -s deploy/pbk-push.timer
          grep -q 'pywebpush==2.5.0' deploy/requirements-push.txt
          grep -q 'reverse_proxy 127.0.0.1:8787' deploy/Caddyfile
          grep -q 'stage74_app_api.py' deploy/pbk-api.service
          grep -q 'caddy validate' deploy/bootstrap_server.sh
          grep -q 'PBK_PASSWORD_HASH' deploy/bootstrap_server.sh
          grep -q '127.0.0.1:8787/v1/health' deploy/bootstrap_server.sh
          grep -q 'pbk-release.timer' deploy/bootstrap_server.sh
          grep -q 'pbk-push.timer' deploy/bootstrap_server.sh
          grep -q 'setup_push.sh' deploy/apply_release.sh
          grep -q 'PBK push status: READY' deploy/apply_release.sh
          grep -q 'PBK release health: OK' deploy/apply_release.sh
          grep -q 'PBK_SKIP_FETCH=1' deploy/apply_release.sh
          grep -q 'ufw allow OpenSSH' deploy/harden_server.sh
          grep -q 'fail2ban' deploy/harden_server.sh
          grep -q '/swapfile' deploy/harden_server.sh
      - name: Market research projection and contract tests
        run: python -m unittest discover -s scripts/tests -p test_market_cards.py
      - name: Rebuild unified data layer
        run: python scripts/stage72_build_data_layer.py
      - name: Validate Stage73 API contract
        run: |
          python scripts/stage73_internal_api.py --self-test
          python -m unittest discover -s scripts/tests -p test_challenger_observations_api.py
      - name: Validate Stage74/75 app API
        run: python scripts/stage74_app_api.py --self-test
      - name: Validate probability projection
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          os.environ['PBK_DB_PATH']='build/pbk_unified.sqlite'
          import stage74_app_api as api
          code,p=api.performance_payload()
          m=p.get('probability_module') or {}
          assert code==200
          assert m.get('status')=='ACTIVE_FORWARD_MONITORING',m
          assert m.get('max_probability_ranking_available') is True,m
          assert m.get('value_ranking_available') is True,m
          assert (m.get('policy') or {}).get('stake_changes') is False,m
          print('Stage75 probability projection: OK')
          PY
      - name: Report
        run: |
          echo 'Stage74 PWA + Stage75 probability/value + runtime + Web Push + auto-release + hardening + freshness: OK'
          cat ops/stage73_last_run.json
