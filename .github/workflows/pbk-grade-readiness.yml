name: PBK Grade Readiness

on:
  pull_request:
    paths:
      - "config/pbk_grade_readiness.json"
      - "config/pbk_team_style_profile.json"
      - "scripts/validate_grade_readiness.py"
      - "scripts/pbk_team_player_grades.py"
      - "scripts/pbk_availability_impacts.py"
      - "scripts/pbk_matchup_style.py"
      - "scripts/pbk_team_style_profiles.py"
      - "scripts/tests/test_grade_readiness.py"
      - "scripts/tests/test_pbk_team_player_grades.py"
      - "scripts/tests/test_pbk_availability_impacts.py"
      - "scripts/tests/test_pbk_matchup_style.py"
      - "scripts/tests/test_pbk_team_style_profiles.py"
      - "docs/pbk_brain_grade_readiness.md"
      - ".github/workflows/pbk-grade-readiness.yml"
  push:
    branches: [main]
    paths:
      - "config/pbk_grade_readiness.json"
      - "config/pbk_team_style_profile.json"
      - "scripts/validate_grade_readiness.py"
      - "scripts/pbk_team_player_grades.py"
      - "scripts/pbk_availability_impacts.py"
      - "scripts/pbk_matchup_style.py"
      - "scripts/pbk_team_style_profiles.py"
      - "scripts/tests/test_grade_readiness.py"
      - "scripts/tests/test_pbk_team_player_grades.py"
      - "scripts/tests/test_pbk_availability_impacts.py"
      - "scripts/tests/test_pbk_matchup_style.py"
      - "scripts/tests/test_pbk_team_style_profiles.py"
      - "docs/pbk_brain_grade_readiness.md"
      - ".github/workflows/pbk-grade-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile grade foundation
        run: python -m py_compile scripts/validate_grade_readiness.py scripts/pbk_team_player_grades.py scripts/pbk_availability_impacts.py scripts/pbk_matchup_style.py scripts/pbk_team_style_profiles.py
      - name: Validate registry
        run: python scripts/validate_grade_readiness.py
      - name: Run readiness guardrail tests
        run: python -m unittest scripts.tests.test_grade_readiness -v
      - name: Run Team and Player Grade tests
        run: python -m unittest scripts.tests.test_pbk_team_player_grades -v
      - name: Run availability and rotation impact tests
        run: python -m unittest scripts.tests.test_pbk_availability_impacts -v
      - name: Run matchup style foundation tests
        run: python -m unittest scripts.tests.test_pbk_matchup_style -v
      - name: Run Team Style Profile tests
        run: python -m unittest scripts.tests.test_pbk_team_style_profiles -v
