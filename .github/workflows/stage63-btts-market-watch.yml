name: Stage 63 Big-5 BTTS Market Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'
  push:
    paths:
      - 'scripts/stage63_btts_market_watch.py'
      - '.github/workflows/stage63-btts-market-watch.yml'

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_SEASON: '2026'
      STAGE63_USER_BOOKMAKER: 'Marathonbet'
      STAGE63_MOVE_THRESHOLD: '0.03'
      STAGE63_OPEN_CAPTURE_HORIZON_H: '336'
      STAGE63_TRACK_HORIZON_H: '72'
      OPS_DIR: 'ops'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage 63 BTTS watch
        run: |
          for attempt in 1 2 3; do
            echo "Stage 63 attempt ${attempt}/3"
            if python scripts/stage63_btts_market_watch.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Stage 63 failed after 3 attempts.'
              exit 1
            fi
            sleep $((attempt * 8))
          done

      - name: Show Stage 63 summary
        run: |
          echo '--- stage63_last_run.json ---'
          cat ops/stage63_last_run.json
          echo '--- latest BTTS crossings ---'
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('ops/stage63_btts_crossings.csv')
          if p.exists():
              with p.open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              print('rows=',len(rows))
              for r in rows[-12:]:
                  print(r.get('league'), r.get('home_team'),'-',r.get('away_team'),r.get('display_selection'),'move_yes=',r.get('movement_yes_pp'),'Marathonbet=',r.get('user_cross_selected_odds'))
          PY

      - name: Commit Stage 63 watch files
        run: |
          git config user.name 'stage63-bot'
          git config user.email 'stage63-bot@users.noreply.github.com'
          git add -A ops
          if git diff --cached --quiet; then
            echo 'No Stage 63 operational changes to commit.'
          else
            git commit -m 'Stage 63 BTTS market watch update'
            git push
          fi

      - name: Upload Stage 63 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage63-btts-market-watch
          path: |
            ops/stage63_last_run.json
            ops/stage63_btts_openers.csv
            ops/stage63_btts_snapshots.csv
            ops/stage63_btts_crossings.csv
            ops/stage63_btts_closes.csv
          if-no-files-found: ignore
          retention-days: 30
