name: Stage 80 Archive Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  pull_request:
    paths:
      - 'scripts/stage80_archive_readiness.py'
      - 'ops/stage80_raw_archive_storage_last_run.json'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_historical_fixture_catalog.py'
      - 'scripts/stage80_historical_player_catalog.py'
      - 'scripts/stage80_lineup_injury_archive.py'
      - 'scripts/tests/test_stage80_archive_readiness.py'
      - 'scripts/tests/test_stage80_stage77_backlog_readiness.py'
      - 'scripts/tests/test_stage80_fixture_history_readiness.py'
      - 'scripts/tests/test_stage80_archive_manifest.py'
      - 'scripts/tests/test_stage80_historical_fixture_catalog.py'
      - 'scripts/tests/test_stage80_historical_fixture_catalog_readiness.py'
      - 'scripts/tests/test_stage80_historical_player_catalog.py'
      - 'scripts/tests/test_stage80_lineup_injury_archive.py'
      - 'docs/stage80_historical_archive.md'
      - 'docs/stage80_fixture_history.md'
      - 'docs/stage80_archive_manifest.md'
      - 'docs/stage80_historical_fixture_catalog.md'
      - 'docs/stage80_historical_player_catalog.md'
      - 'docs/stage80_lineup_injury_archive.md'
      - '.github/workflows/stage80-archive-readiness.yml'
  push:
    paths:
      - 'scripts/stage80_archive_readiness.py'
      - 'ops/stage80_raw_archive_storage_last_run.json'
      - 'ops/stage80_raw_archive_provider_probe_last_run.json'
      - 'scripts/stage80_archive_manifest.py'
      - 'scripts/stage80_historical_fixture_catalog.py'
      - 'scripts/stage80_historical_player_catalog.py'
      - 'scripts/stage80_lineup_injury_archive.py'
      - 'scripts/tests/test_stage80_lineup_injury_archive.py'
      - 'scripts/tests/test_stage80_archive_readiness.py'
      - 'scripts/tests/test_stage80_stage77_backlog_readiness.py'
      - 'scripts/tests/test_stage80_fixture_history_readiness.py'
      - 'scripts/tests/test_stage80_archive_manifest.py'
      - 'scripts/tests/test_stage80_historical_fixture_catalog.py'
      - 'scripts/tests/test_stage80_historical_fixture_catalog_readiness.py'
      - 'scripts/tests/test_stage80_historical_player_catalog.py'
      - 'docs/stage80_historical_archive.md'
      - 'docs/stage80_fixture_history.md'
      - 'docs/stage80_archive_manifest.md'
      - 'docs/stage80_historical_fixture_catalog.md'
      - 'docs/stage80_historical_player_catalog.md'
      - 'docs/stage80_lineup_injury_archive.md'
      - '.github/workflows/stage80-archive-readiness.yml'

permissions:
  contents: read

concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_ARCHIVE_DIR: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Stage80 archive governance and projections
        run: |
          python -m py_compile scripts/stage80_archive_readiness.py
          python -m py_compile scripts/stage80_archive_manifest.py
          python -m py_compile scripts/stage80_historical_fixture_catalog.py
          python -m py_compile scripts/stage80_historical_player_catalog.py
          python -m py_compile scripts/stage80_lineup_injury_archive.py
      - name: Provider-free Stage80 tests
        run: |
          python -m unittest scripts.tests.test_stage80_archive_readiness -v
          python -m unittest scripts.tests.test_stage80_stage77_backlog_readiness -v
          python -m unittest scripts.tests.test_stage80_fixture_history_readiness -v
          python -m unittest scripts.tests.test_stage80_archive_manifest -v
          python -m unittest scripts.tests.test_stage80_historical_fixture_catalog -v
          python -m unittest scripts.tests.test_stage80_historical_fixture_catalog_readiness -v
          python -m unittest scripts.tests.test_stage80_historical_player_catalog -v
          python -m unittest scripts.tests.test_stage80_lineup_injury_archive -v
      - name: Real-repo catalogs, manifest and readiness smoke
        run: |
          python scripts/stage80_historical_fixture_catalog.py
          python scripts/stage80_historical_player_catalog.py
          python scripts/stage80_lineup_injury_archive.py
          python scripts/stage80_archive_manifest.py
          python scripts/stage80_archive_readiness.py
      - name: Assert provider isolation
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports' scripts/stage80_archive_readiness.py scripts/stage80_archive_manifest.py scripts/stage80_historical_fixture_catalog.py scripts/stage80_historical_player_catalog.py scripts/stage80_lineup_injury_archive.py; then
            echo 'Stage80 archive governance/projections must remain provider-free.' >&2
            exit 1
          fi
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated Stage80 outputs are forbidden in the feature PR.' >&2
            exit 1
          fi

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_ARCHIVE_DIR: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build provider-free Stage80 archive layers
        run: |
          python scripts/stage80_historical_fixture_catalog.py
          python scripts/stage80_historical_player_catalog.py
          python scripts/stage80_lineup_injury_archive.py
          python scripts/stage80_archive_manifest.py
          python scripts/stage80_archive_readiness.py
      - name: Publish Stage80 outputs safely
        shell: bash
        run: |
          git config user.name 'stage80-bot'
          git config user.email 'stage80-bot@users.noreply.github.com'
          git add ops/historical_fixtures.csv ops/stage80_fixture_catalog_last_run.json
          git add ops/historical_players.csv ops/stage80_player_catalog_last_run.json
          git add ops/lineup_snapshots.csv ops/injury_snapshots.csv ops/stage80_lineup_injury_archive_last_run.json
          git add ops/stage80_archive_manifest.json ops/stage80_archive_manifest.csv
          git add ops/stage80_archive_readiness.json ops/stage80_archive_readiness.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 archive layers update'
          python scripts/publish_operational_commit.py
