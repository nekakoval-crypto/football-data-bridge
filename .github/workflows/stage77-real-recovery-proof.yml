name: Stage 77 Real Recovery Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install raw archive S3 client
        run: |
          python -m pip install --disable-pip-version-check boto3

      - name: Compile recovery proof
        run: |
          python -m py_compile scripts/stage77_real_recovery_proof.py

      - name: Run real recovery proof
        run: |
          python scripts/stage77_real_recovery_proof.py
