name: Stage 69 WATCH Promotion Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '54 * * * *'
  push:
    paths:
      - 'scripts/stage69_watch_promotion_gate.py'
      - 'research/stage69_watch_promotion_policy_2026-09-11.md'
      - '.github/workflows/stage69-watch-promotion-gate.yml'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Stage 69 promotion gate
        run: python scripts/stage69_watch_promotion_gate.py

      - name: Show Stage 69 summary
        run: |
          cat ops/stage69_last_run.json
          echo '--- watch_promotion_gate.md ---'
          cat ops/watch_promotion_gate.md

      - name: Commit Stage 69 operational files
        run: |
          git config user.name 'stage69-bot'
          git config user.email 'stage69-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "Stage69 publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            python scripts/stage69_watch_promotion_gate.py
            git add ops/watch_promotion_gate.json ops/watch_promotion_gate.md ops/stage69_last_run.json
            if git diff --cached --quiet; then
              echo 'No Stage 69 changes to commit.'
              exit 0
            fi
            git commit -m 'Stage 69 watch promotion gate update'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Concurrent push detected; rebuilding from latest main.'
            sleep 2
          done
          exit 1

      - name: Upload Stage 69 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage69-watch-promotion-gate
          path: |
            ops/watch_promotion_gate.json
            ops/watch_promotion_gate.md
            ops/stage69_last_run.json
          if-no-files-found: error
          retention-days: 30
