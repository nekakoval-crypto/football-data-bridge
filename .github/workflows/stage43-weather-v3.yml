name: stage43-weather-v3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage43_weather_v3.py'
      - '.github/workflows/stage43-weather-v3.yml'
  workflow_dispatch:

jobs:
  build-weather-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build historical weather layer v3
        run: python scripts/stage43_weather_v3.py
      - name: Upload Stage 43 weather v3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage43-weather-v3
          path: out_v3/
          compression-level: 6
          retention-days: 7
