name: Stage 75 Probability and Value

on:
  workflow_dispatch:
  schedule:
    - cron: '48 * * * *'
  push:
    paths:
      - 'scripts/stage75_probability_value.py'
      - 'scripts/stage75_value_radar.py'
      - 'scripts/pbk_probability_engine.py'
      - 'scripts/pbk_value_engine.py'
      - 'scripts/pbk_calculation_contract.py'
      - 'scripts/pbk_forward_journal.py'
      - 'config/pbk_probability_models.json'
      - 'config/pbk_probability_engine.json'
      - 'config/pbk_value_engine.json'
      - 'config/pbk_market_probability_readiness.json'
      - 'research/stage75_probability_value_policy_2026-09-11.md'
      - 'research/stage75_probability_value_test_report_2026-09-11.md'
      - '.github/workflows/stage75-probability-value.yml'

permissions:
  contents: write

concurrency:
  group: stage75-probability-value
  cancel-in-progress: false

jobs:
  probability:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build probability ledger, Probability Engine, Value Engine v2 and immutable Forward journal
        run: |
          python scripts/stage75_probability_value.py
          python scripts/pbk_probability_engine.py
          python scripts/pbk_value_engine.py
          python scripts/pbk_forward_journal.py
      - name: Show probability, Probability Engine, Value Engine and Forward journal summary
        run: |
          cat ops/stage75_last_run.json
          cat ops/probability_rankings.json
          cat ops/probability_engine_latest.json
          cat ops/value_engine_latest.json
          cat ops/pbk_forward_journal_last_run.json
      - name: Commit Stage75 outputs safely
        run: |
          git config user.name 'stage75-bot'
          git config user.email 'stage75-bot@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python scripts/stage75_probability_value.py
          python scripts/pbk_probability_engine.py
          python scripts/pbk_value_engine.py
          python scripts/pbk_forward_journal.py
          git add \
            ops/stage75_probability_predictions.csv \
            ops/stage75_probability_settlements.csv \
            ops/probability_rankings.json \
            ops/probability_performance.json \
            ops/probability_engine_latest.json \
            ops/value_engine_latest.json \
            ops/stage75_last_run.json \
            ops/stage75_value_radar.jsonl \
            ops/value_radar_current.json \
            ops/forward_prematch_journal.jsonl \
            ops/forward_settlement_journal.jsonl \
            ops/pbk_forward_journal_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage75 probability, value and Forward journal update'
          python scripts/publish_operational_commit.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage75-probability-value
          path: |
            ops/stage75_probability_predictions.csv
            ops/stage75_probability_settlements.csv
            ops/probability_rankings.json
            ops/probability_performance.json
            ops/probability_engine_latest.json
            ops/value_engine_latest.json
            ops/stage75_last_run.json
            ops/stage75_value_radar.jsonl
            ops/value_radar_current.json
            ops/forward_prematch_journal.jsonl
            ops/forward_settlement_journal.jsonl
            ops/pbk_forward_journal_last_run.json
          retention-days: 30
