name: stage43-weather-meteostat

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage43_weather_meteostat.py'
      - '.github/workflows/stage43-weather-meteostat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install DuckDB
        run: python -m pip install --quiet duckdb
      - name: Build Meteostat historical weather layer
        run: python scripts/stage43_weather_meteostat.py
      - name: Upload Stage43 Meteostat artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage43-weather-meteostat
          path: out_meteostat/
          compression-level: 6
          retention-days: 7
