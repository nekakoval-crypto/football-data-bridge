name: Stage 73 Internal API

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Stage 72 Unified Data Layer']
    types: [completed]
  schedule:
    - cron: '6 * * * *'
  push:
    paths:
      - 'scripts/stage72_build_data_layer.py'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_challenger_observations_api.py'
      - 'scripts/tests/test_stage80_archive_read_api.py'
      - 'ops/historical_transfer_events.csv'
      - 'ops/pbk_player_xg_xa_research.csv'
      - 'config/pbk_strategy_filter.json'
      - 'config/pbk_market_scope.json'
      - '.github/workflows/stage73-internal-api.yml'
  pull_request:
    paths:
      - 'scripts/stage72_build_data_layer.py'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_challenger_observations_api.py'
      - 'scripts/tests/test_stage80_archive_read_api.py'
      - 'config/pbk_strategy_filter.json'
      - 'config/pbk_market_scope.json'
      - '.github/workflows/stage73-internal-api.yml'

permissions:
  contents: write

concurrency:
  group: stage73-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-contract:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: 'ops'
      STAGE72_DB_PATH: 'build/pbk_unified.sqlite'
      PBK_DB_PATH: 'build/pbk_unified.sqlite'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Stage 72 data layer
        run: python scripts/stage72_build_data_layer.py

      - name: Test Stage 73 API contract
        run: |
          python scripts/stage73_internal_api.py --self-test
          python -m unittest discover -s scripts/tests -p test_challenger_observations_api.py
          python -m unittest scripts.tests.test_stage80_archive_read_api -v

      - name: Show Stage 73 summary
        run: cat ops/stage73_last_run.json

      - name: Commit Stage 73 metadata
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'stage73-bot'
          git config user.email 'stage73-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "Stage73 metadata publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            # Rebuild against the latest Stage72 inputs, but Stage72 owns its
            # own metadata files. Stage73 publishes only its own telemetry.
            python scripts/stage72_build_data_layer.py
            python scripts/stage73_internal_api.py --self-test

            git add ops/stage73_last_run.json
            if git diff --cached --quiet; then
              echo 'No Stage73 metadata changes to commit.'
              git restore --worktree -- .
              exit 0
            fi

            git commit -m 'Stage 73 internal API contract update'
            git restore --worktree -- .

            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'Concurrent push detected; rebuilding Stage73 from latest main.'
            sleep 2
          done
          exit 1

      - name: Upload API-ready SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbk-stage73-api-data
          path: build/pbk_unified.sqlite
          if-no-files-found: error
          retention-days: 30
