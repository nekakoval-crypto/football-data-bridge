name: Stage 267 Shared Venue Evidence Batch 1

on:
  pull_request:
    paths:
      - 'config/pbk_venue_evidence.csv'
      - 'config/pbk_venue_overrides.csv'
      - 'scripts/tests/test_stage267_shared_venue_evidence.py'
      - '.github/workflows/stage267-shared-venue-evidence.yml'
      - '.github/workflows/stage265-venue-registry.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared venue evidence
        run: |
          python -m pytest scripts/tests/test_stage267_shared_venue_evidence.py -q
