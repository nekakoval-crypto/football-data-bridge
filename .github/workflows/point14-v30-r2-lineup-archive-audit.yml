name: PBK Point14 V30 R2 Lineup Archive Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto
      OPS_DIR: ops

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3

      - name: Compile audit
        run: python -m py_compile scripts/point14_v30_r2_lineup_archive_audit.py

      - name: Assert provider key is unavailable
        shell: bash
        run: |
          if [ -n "${API_FOOTBALL_KEY:-}" ]; then
            echo "API_FOOTBALL_KEY unexpectedly available" >&2
            exit 1
          fi
          echo "Provider credential absent: archive-only audit enforced."

      - name: Run exact R2 lineup archive audit
        run: python scripts/point14_v30_r2_lineup_archive_audit.py

      - name: Show audit telemetry
        run: cat ops/point14_v30_r2_lineup_archive_audit.json

      - name: Upload audit telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: point14-v30-r2-lineup-archive-audit
          path: ops/point14_v30_r2_lineup_archive_audit.json
          if-no-files-found: warn
          retention-days: 30
