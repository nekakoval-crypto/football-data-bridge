name: Stage 71I Core Market Settlement

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
  push:
    paths:
      - 'scripts/stage71i_core_market_settlement.py'
      - 'research/stage71i_core_market_settlement_policy_2026-09-11.md'
      - '.github/workflows/stage71i-core-market-settlement.yml'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Settle closed prospective market observations
        run: python scripts/stage71i_core_market_settlement.py
      - name: Show settlement summary
        run: cat ops/stage71i_last_run.json
      - name: Commit settlement outputs safely
        run: |
          git config user.name 'stage71i-bot'
          git config user.email 'stage71i-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/stage71i_core_market_settlement.py
            git add ops/stage71i_market_settlements.csv ops/stage71i_last_run.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Stage71I core market settlement update'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: stage71i-core-market-settlement
          path: |
            ops/stage71i_market_settlements.csv
            ops/stage71i_last_run.json
          retention-days: 30
