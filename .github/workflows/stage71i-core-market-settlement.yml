name: Stage 71I Core Market Settlement

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */2 * * *'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Settle closed prospective market observations once
        run: python scripts/stage71i_core_market_settlement.py
      - name: Show settlement summary
        run: cat ops/stage71i_last_run.json
      - name: Commit settlement outputs without repeating API calls
        run: |
          git config user.name 'stage71i-bot'
          git config user.email 'stage71i-bot@users.noreply.github.com'
          git add ops/stage71i_market_settlements.csv ops/stage71i_last_run.json
          if git diff --cached --quiet; then
            echo 'No Stage71I changes to commit.'
            exit 0
          fi
          git commit -m 'Stage71I core market settlement update'
          if git pull --rebase origin main && git push origin main; then
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo 'Concurrent update: do not repeat API calls. Outputs remain in artifact; next scheduled run will reconcile.'
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage71i-core-market-settlement
          path: |
            ops/stage71i_market_settlements.csv
            ops/stage71i_last_run.json
          retention-days: 30
