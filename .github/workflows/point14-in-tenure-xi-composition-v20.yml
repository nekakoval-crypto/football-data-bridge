name: Point14 in-tenure XI composition V20

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v20-xi-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run V20 unit tests
        run: python -m unittest scripts.tests.test_point14_in_tenure_xi_composition_v20 -v

      - name: Run V20 real XI composition audit
        run: python -m scripts.point14_in_tenure_xi_composition_v20

      - name: Verify coach tenure ledger unchanged
        run: git diff --exit-code -- ops/coach_tenure_history.csv

      - name: Upload V20 artifact
        uses: actions/upload-artifact@v4
        with:
          name: point14-in-tenure-xi-composition-v20
          path: ops/point14_in_tenure_xi_composition_v20.json
          if-no-files-found: error
