name: stage43-weather-v4
on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage43_weather_v4.py'
      - '.github/workflows/stage43-weather-v4.yml'
  workflow_dispatch:

jobs:
  build-weather-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build historical weather layer v4
        run: python scripts/stage43_weather_v4.py
      - name: Upload Stage 43 weather v4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage43-weather-v4
          path: out_v4/
          compression-level: 6
          retention-days: 7
