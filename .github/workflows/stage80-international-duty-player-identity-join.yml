name: Stage 80 International Duty Player Identity Join

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Stage 80 International Duty Player Evidence Capture', 'Fetch Transfermarkt CSV']
    types: [completed]
  pull_request:
    paths:
      - 'scripts/stage80_international_duty_player_identity_join.py'
      - 'scripts/tests/test_stage80_international_duty_player_identity_join.py'
      - 'ops/pbk_transfermarkt_player_identity.csv'
      - '.github/workflows/stage80-international-duty-player-identity-join.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage80_international_duty_player_identity_join.py'
      - 'scripts/tests/test_stage80_international_duty_player_identity_join.py'
      - 'ops/pbk_transfermarkt_player_identity.csv'
      - '.github/workflows/stage80-international-duty-player-identity-join.yml'

permissions:
  contents: read

concurrency:
  group: stage80-international-duty-player-identity-join-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and provider-free tests
        run: |
          python -m py_compile scripts/stage80_international_duty_player_identity_join.py
          python -m unittest scripts.tests.test_stage80_international_duty_player_identity_join -v
      - name: Provider isolation
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports|ApiFootballBroker|api_get' scripts/stage80_international_duty_player_identity_join.py; then
            echo 'International player identity join must remain provider-free.' >&2
            exit 1
          fi
      - name: Feature diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^ops/'; then
            echo 'Generated identity-join outputs are forbidden in the feature PR.' >&2
            exit 1
          fi

  materialize:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS_DIR: ops
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact international player identity join
        run: python scripts/stage80_international_duty_player_identity_join.py
      - name: Verify exact identity governance
        run: |
          python - <<'PY'
          import csv, json
          meta=json.load(open('ops/stage80_international_duty_player_identity_join_last_run.json',encoding='utf-8'))
          assert meta['version']=='PBK_STAGE80_INTERNATIONAL_DUTY_PLAYER_IDENTITY_JOIN_V1_EXACT_ID_ONLY', meta
          assert meta['status']=='OK', meta
          assert meta['evidence_rows']>0, meta
          assert meta['valid_evidence_rows']==meta['evidence_rows'], meta
          assert meta['invalid_evidence_rows']==0, meta
          assert meta['international_evidence_players']>0, meta
          assert meta['output_rows']==meta['international_evidence_players'], meta
          assert meta['duplicate_output_players']==0, meta
          assert meta['invalid_output_rows']==0, meta
          assert meta['historical_player_catalog_duplicate_rows']==0, meta
          assert meta['historical_player_catalog_conflicts']==0, meta
          assert meta['safe_transfer_identity_conflict_players']==0, meta
          assert 0 <= meta['exact_pbk_catalog_player_coverage_pct'] <= 100, meta
          assert 0 <= meta['safe_transfer_identity_coverage_pct'] <= 100, meta
          assert meta['identity_contract']=='EXACT_API_FOOTBALL_PLAYER_ID', meta
          assert meta['exact_id_only'] is True, meta
          assert meta['fuzzy_matching_used'] is False, meta
          assert meta['name_used_for_identity'] is False, meta
          assert meta['club_at_fixture_date_derived'] is False, meta
          assert meta['current_club_substituted_for_historical_club'] is False, meta
          assert meta['provider_calls']==0, meta
          assert meta['research_only'] is True, meta
          assert meta['operational_betting_authority'] is False, meta
          assert meta['creates_signal'] is False, meta
          assert meta['probability_mutation'] is False, meta
          assert meta['eligibility_mutation'] is False, meta
          assert meta['stake_changes'] is False, meta
          assert meta['forward_journal_mutation'] is False, meta

          with open('ops/international_duty_player_identity_join.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==meta['output_rows']
          assert len({r['player_id'] for r in rows})==len(rows)
          assert all(r['identity_contract']=='EXACT_API_FOOTBALL_PLAYER_ID' for r in rows)
          assert all(r['fuzzy_matching_used']=='false' for r in rows)
          assert all(r['name_used_for_identity']=='false' for r in rows)
          assert all(r['club_at_fixture_date_status']=='NOT_DERIVED' for r in rows)
          assert all(r['provider_calls']=='0' for r in rows)
          assert all(r['operational_betting_authority']=='false' for r in rows)

          print({
              'players':meta['international_evidence_players'],
              'pbk_exact_matches':meta['exact_pbk_catalog_matched_players'],
              'pbk_coverage_pct':meta['exact_pbk_catalog_player_coverage_pct'],
              'safe_transfer_matches':meta['international_players_with_safe_transfer_identity'],
              'transfer_coverage_pct':meta['safe_transfer_identity_coverage_pct'],
          })
          PY
      - name: Publish exact identity join safely
        shell: bash
        run: |
          git config user.name 'stage80-international-duty-bot'
          git config user.email 'stage80-international-duty-bot@users.noreply.github.com'
          git add ops/international_duty_player_identity_join.csv
          git add ops/stage80_international_duty_player_identity_join_last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage 80 international-duty exact player identity join update'
          python scripts/publish_operational_commit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: international-duty-player-identity-join
          path: |
            ops/international_duty_player_identity_join.csv
            ops/stage80_international_duty_player_identity_join_last_run.json
          if-no-files-found: error
          retention-days: 90
