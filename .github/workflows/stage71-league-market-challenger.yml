name: Stage 71 League Market Challenger

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7,15,23 * * *'
  pull_request:
    paths:
      - 'scripts/stage71*'
      - 'scripts/tests/test_stage71*'
      - '.github/workflows/stage71-league-market-challenger.yml'
  push:
    paths:
      - 'scripts/stage71_league_market_challenger.py'
      - 'scripts/stage71_challenger_capture.py'
      - 'scripts/stage71_observation_audit.py'
      - 'scripts/tests/test_stage71*'
      - 'scripts/stage71_regime_overlay.py'
      - 'scripts/stage71_progress_overlay.py'
      - 'research/stage71_challenger_policy_2026-09-11.md'
      - 'research/stage71_seed_evidence.csv'
      - 'config/pbk_competition_scope.json'
      - '.github/workflows/stage71-league-market-challenger.yml'

permissions:
  contents: read

concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate observation reconciliation without API calls
        run: python -m unittest discover -s scripts/tests -p 'test_stage71*.py' -v
      - name: Validate data layer and API compatibility
        run: |
          python scripts/stage72_build_data_layer.py
          python scripts/stage73_internal_api.py --self-test
          python scripts/stage74_app_api.py --self-test

  challenger:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_SEASON: '2026'
      OPS_DIR: 'ops'
      STAGE71_NEXT_PER_LEAGUE: '5'
      STAGE71_R2_FREEZE_HOURS: '12'
      STAGE71_MAX_API_CALLS: '60'
      STAGE71_MAX_DAILY_API_CALLS: '180'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Stage 71 catalog and baseline board
        run: python scripts/stage71_league_market_challenger.py

      - name: Capture prospective league challengers
        run: python scripts/stage71_challenger_capture.py

      - name: Audit observation completeness and settlement health
        run: python scripts/stage71_observation_audit.py

      - name: Rebuild board with fresh prospective rows
        run: python scripts/stage71_league_market_challenger.py

      - name: Apply regime-change discovery gate
        run: python scripts/stage71_regime_overlay.py

      - name: Build live challenger progress
        run: python scripts/stage71_progress_overlay.py

      - name: Show Stage 71 summary
        run: |
          cat ops/stage71_capture_last_run.json
          cat ops/stage71_observation_health.json
          cat ops/stage71_last_run.json
          echo '--- challenger board ---'
          cat ops/stage71_challenger_board.md

      - name: Commit Stage 71 operational files
        run: |
          git config user.name 'stage71-bot'
          git config user.email 'stage71-bot@users.noreply.github.com'
          git add ops/stage71_*
          if git diff --cached --quiet; then
            echo 'No Stage 71 changes to commit.'
          else
            git commit -m 'Stage 71 challenger capture update'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Stage 71 snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage71-challenger-board
          path: |
            ops/stage71_league_catalog.csv
            ops/stage71_research_trigger_ledger.csv
            ops/stage71_challenger_forward.csv
            ops/stage71_capture_last_run.json
            ops/stage71_observation_state.json
            ops/stage71_observation_health.json
            ops/stage71_challenger_board.csv
            ops/stage71_challenger_board.json
            ops/stage71_challenger_board.md
            ops/stage71_last_run.json
          if-no-files-found: error
          retention-days: 30
