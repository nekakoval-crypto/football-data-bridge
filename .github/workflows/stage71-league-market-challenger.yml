name: Stage 71 League Market Challenger

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7,15,23 * * *'
  pull_request:
    paths:
      - 'scripts/stage71*'
      - 'scripts/stage77_player_stats_capture.py'
      - 'scripts/stage80_fixture_history_archive.py'
      - 'scripts/tests/test_stage71*'
      - 'scripts/tests/test_stage77_player_stats_backlog.py'
      - 'scripts/tests/test_stage80_fixture_history_archive.py'
      - '.github/workflows/stage71-league-market-challenger.yml'
  push:
    paths:
      - 'scripts/stage71_league_market_challenger.py'
      - 'scripts/stage71_challenger_capture.py'
      - 'scripts/stage71_current_round_capture.py'
      - 'scripts/stage71_stage77_backlog_refresh.py'
      - 'scripts/stage71_observation_audit.py'
      - 'scripts/stage77_player_stats_capture.py'
      - 'scripts/stage80_fixture_history_archive.py'
      - 'scripts/tests/test_stage71*'
      - 'scripts/tests/test_stage77_player_stats_backlog.py'
      - 'scripts/tests/test_stage80_fixture_history_archive.py'
      - 'scripts/stage71_regime_overlay.py'
      - 'scripts/stage71_progress_overlay.py'
      - 'research/stage71_challenger_policy_2026-09-11.md'
      - 'research/stage71_seed_evidence.csv'
      - 'config/pbk_competition_scope.json'
      - '.github/workflows/stage71-league-market-challenger.yml'

permissions:
  contents: read

concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate observation reconciliation without API calls
        run: |
          python -m unittest discover -s scripts/tests -p 'test_stage71*.py' -v
          python -m unittest scripts.tests.test_stage77_player_stats_backlog -v
          python -m unittest scripts.tests.test_stage80_fixture_history_archive -v
      - name: Validate provider-free archive helpers
        shell: bash
        run: |
          if grep -nE 'urllib\.|requests\.|api-sports\.io|v3\.football\.api-sports' scripts/stage71_stage77_backlog_refresh.py scripts/stage80_fixture_history_archive.py; then
            echo 'Stage71 backlog and Stage80 fixture-history helpers must remain provider-free.' >&2
            exit 1
          fi
      - name: Validate data layer and API compatibility
        run: |
          python scripts/stage72_build_data_layer.py
          python scripts/stage73_internal_api.py --self-test
          python scripts/stage74_app_api.py --self-test

  challenger:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto
      API_FOOTBALL_SEASON: '2026'
      OPS_DIR: 'ops'
      STAGE71_NEXT_PER_LEAGUE: '5'
      STAGE71_R2_FREEZE_HOURS: '12'
      STAGE71_MAX_API_CALLS: '60'
      STAGE71_MAX_DAILY_API_CALLS: '7000'
      STAGE71_API_SAFETY_MARGIN: '10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raw archive S3 client
        run: python -m pip install --disable-pip-version-check boto3


      - name: Capture provider-defined current rounds
        run: python scripts/stage71_current_round_capture.py

      - name: Append current-round observations to Stage80 fixture history
        run: python scripts/stage80_fixture_history_archive.py

      - name: Refresh durable Stage77 finished-fixture backlog
        run: python scripts/stage71_stage77_backlog_refresh.py

      - name: Resolve Stage 71 catalog and baseline board
        run: python scripts/stage71_league_market_challenger.py

      - name: Capture prospective league challengers
        run: python scripts/stage71_challenger_capture.py

      - name: Audit observation completeness and settlement health
        run: python scripts/stage71_observation_audit.py

      - name: Rebuild board with fresh prospective rows
        run: python scripts/stage71_league_market_challenger.py

      - name: Apply regime-change discovery gate
        run: python scripts/stage71_regime_overlay.py

      - name: Build live challenger progress
        run: python scripts/stage71_progress_overlay.py

      - name: Show Stage 71 summary
        run: |
          cat ops/stage71_capture_last_run.json
          cat ops/stage71_observation_health.json
          cat ops/stage71_last_run.json
          cat ops/stage80_fixture_history_last_run.json
          if [ -f ops/stage77_player_stats_backlog.csv ]; then
            echo '--- Stage77 durable backlog ---'
            cat ops/stage77_player_stats_backlog.csv
          fi
          echo '--- challenger board ---'
          cat ops/stage71_challenger_board.md

      - name: Commit Stage 71 operational files
        run: |
          git config user.name 'stage71-bot'
          git config user.email 'stage71-bot@users.noreply.github.com'
          git add ops/stage71_* ops/current_round_* ops/stage80_fixture_history_last_run.json
          if [ -f ops/stage77_player_stats_backlog.csv ]; then git add ops/stage77_player_stats_backlog.csv; fi
          if [ -f ops/fixture_history_snapshots.csv ]; then git add ops/fixture_history_snapshots.csv; fi
          if git diff --cached --quiet; then
            echo 'No Stage 71 changes to commit.'
          else
            git commit -m 'Stage 71 challenger capture update'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Stage 71 snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage71-challenger-board
          path: |
            ops/stage71_league_catalog.csv
            ops/stage71_research_trigger_ledger.csv
            ops/stage71_challenger_forward.csv
            ops/stage71_capture_last_run.json
            ops/stage71_observation_state.json
            ops/stage71_observation_health.json
            ops/stage71_challenger_board.csv
            ops/stage71_challenger_board.json
            ops/stage71_challenger_board.md
            ops/stage71_last_run.json
            ops/current_round_leagues.csv
            ops/current_round_fixtures.csv
            ops/current_round_last_run.json
            ops/fixture_history_snapshots.csv
            ops/stage80_fixture_history_last_run.json
            ops/stage77_player_stats_backlog.csv
          if-no-files-found: error
          retention-days: 30
