name: stage43-weather-v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage43_weather_v2.py'
      - '.github/workflows/stage43-weather-v2.yml'
  workflow_dispatch:

jobs:
  build-weather-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build historical weather layer v2
        run: python scripts/stage43_weather_v2.py
      - name: Upload Stage 43 weather v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage43-weather-data-v2
          path: out_v2/
          compression-level: 6
          retention-days: 7
