name: PBK34 Live Event Recovery 343

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbk-api-football-global
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_GLOBAL_NORMAL_CEILING: '6800'
      API_FOOTBALL_GLOBAL_ABSOLUTE_CEILING: '7350'
      API_FOOTBALL_QUOTA_CLASS: NORMAL
      PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.PBK_RAW_ARCHIVE_S3_ACCESS_KEY_ID }}
      PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.PBK_RAW_ARCHIVE_S3_SECRET_ACCESS_KEY }}
      PBK_RAW_ARCHIVE_S3_BUCKET: ${{ secrets.PBK_RAW_ARCHIVE_S3_BUCKET }}
      PBK_RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.PBK_RAW_ARCHIVE_S3_ENDPOINT }}
      PBK_RAW_ARCHIVE_S3_PREFIX: api-football-raw
      PBK_RAW_ARCHIVE_S3_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install archive client
        run: python -m pip install boto3

      - name: Validate capture script
        run: python -m py_compile scripts/pbk34_live_events_capture_343.py

      - name: Capture nine fixture event archives
        run: python scripts/pbk34_live_events_capture_343.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbk34-live-events-343
          path: ops/pbk34_live_events_capture_343_result.json
          if-no-files-found: warn
