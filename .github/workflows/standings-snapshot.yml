name: Standings Snapshot Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    paths:
      - 'scripts/standings_snapshot_capture.py'
      - 'scripts/stage72_build_data_layer.py'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_standings*.py'
      - '.github/workflows/standings-snapshot.yml'
  push:
    paths:
      - 'scripts/standings_snapshot_capture.py'
      - 'scripts/stage72_build_data_layer.py'
      - 'scripts/stage73_internal_api.py'
      - 'scripts/tests/test_standings*.py'
      - '.github/workflows/standings-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: stage71-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_standings*.py' -v

  capture:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_SEASON: '2026'
      OPS_DIR: ops
      STANDINGS_MAX_API_CALLS: '16'
      STAGE71_API_SAFETY_MARGIN: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/standings_snapshot_capture.py
      - name: Publish standings operational files
        run: |
          git config user.name 'standings-bot'
          git config user.email 'standings-bot@users.noreply.github.com'
          git add ops/standings_snapshots.csv ops/standings_capture_state.json ops/standings_snapshot_last_run.json ops/stage71_observation_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Standings snapshot capture update'
          python scripts/publish_operational_commit.py
