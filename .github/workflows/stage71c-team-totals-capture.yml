name: Stage 71C Team Totals Capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
      API_FOOTBALL_SEASON: '2026'
      STAGE71C_USER_BOOKMAKER: 'Marathonbet'
      STAGE71C_OPEN_HORIZON_H: '336'
      STAGE71C_TRACK_HORIZON_H: '72'
      STAGE71C_NEXT_PER_LEAGUE: '10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture team-total market data
        run: python scripts/stage71c_team_totals_capture.py
      - name: Show Stage71C summary
        run: cat ops/stage71c_last_run.json
      - name: Upload Stage71C diagnostic snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage71c-team-totals-diagnostic
          path: |
            ops/stage71c_team_total_openers.csv
            ops/stage71c_team_total_snapshots.csv
            ops/stage71c_team_total_closes.csv
            ops/stage71c_last_run.json
          if-no-files-found: ignore
          retention-days: 7
