name: Stage 71C Team Totals Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    paths:
      - 'scripts/stage71c_team_totals_capture.py'
      - 'research/stage71c_team_totals_prereg_2026-09-11.md'
      - 'config/pbk_market_scope.json'
      - '.github/workflows/stage71c-team-totals-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
      API_FOOTBALL_SEASON: '2026'
      STAGE71C_USER_BOOKMAKER: 'Marathonbet'
      STAGE71C_OPEN_HORIZON_H: '336'
      STAGE71C_TRACK_HORIZON_H: '72'
      STAGE71C_NEXT_PER_LEAGUE: '10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture team-total market data
        run: |
          for attempt in 1 2 3; do
            echo "Stage71C attempt ${attempt}/3"
            if python scripts/stage71c_team_totals_capture.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 8))
          done

      - name: Show Stage71C summary
        run: cat ops/stage71c_last_run.json

      - name: Commit Stage71C operational files
        run: |
          git config user.name 'stage71c-bot'
          git config user.email 'stage71c-bot@users.noreply.github.com'
          git add ops/stage71c_team_total_openers.csv \
                  ops/stage71c_team_total_snapshots.csv \
                  ops/stage71c_team_total_closes.csv \
                  ops/stage71c_last_run.json
          if git diff --cached --quiet; then
            echo 'No Stage71C changes to commit.'
          else
            git commit -m 'Stage71C team totals capture update'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                exit 0
              fi
              echo "Concurrent push detected; retry ${attempt}/3"
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              sleep 2
            done
            exit 1
          fi

      - name: Upload Stage71C snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage71c-team-totals-capture
          path: |
            ops/stage71c_team_total_openers.csv
            ops/stage71c_team_total_snapshots.csv
            ops/stage71c_team_total_closes.csv
            ops/stage71c_last_run.json
          if-no-files-found: ignore
          retention-days: 30
