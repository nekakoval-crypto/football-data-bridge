name: Stage 53 Daily R1-R2-R3 Screener

# Live verification trigger: 2026-09-11
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    paths:
      - 'scripts/stage53_daily_screener.py'
      - '.github/workflows/daily-screener.yml'

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_SEASON: '2026'
      FD_SEASON_CODE: '2627'
      OPS_DIR: 'ops'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight API-Football catalogues
        run: |
          python - <<'PY'
          import json, os, urllib.request

          key = os.environ['API_FOOTBALL_KEY']
          base = 'https://v3.football.api-sports.io'

          def get(path):
              req = urllib.request.Request(base + path, headers={'x-apisports-key': key})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          books = get('/odds/bookmakers')
          bets = get('/odds/bets')
          if books.get('errors'):
              raise RuntimeError(f"bookmakers: {books['errors']}")
          if bets.get('errors'):
              raise RuntimeError(f"bets: {bets['errors']}")

          b365 = [x for x in books.get('response', []) if 'bet365' in (x.get('name') or '').lower()]
          winner = [x for x in bets.get('response', []) if 'match winner' in (x.get('name') or '').lower()]
          print('BET365_MATCHES=', b365)
          print('MATCH_WINNER_MATCHES=', winner)
          print('BOOKMAKERS_COUNT=', len(books.get('response', [])))
          print('PREMATCH_BETS_COUNT=', len(bets.get('response', [])))
          PY

      - name: Run daily screener and settle forward log
        run: python scripts/stage53_daily_screener.py

      - name: Show daily summary
        run: |
          echo '--- last_run.json ---'
          cat ops/last_run.json
          echo '--- signal rows ---'
          python - <<'PY'
          import csv
          p='ops/context_passports.csv'
          with open(p,encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          print('signal_matches=',len(rows))
          for r in rows:
              print(r['match_date'], r['league'], r['home_team'], '-', r['away_team'], r['signal_rules'], 'exec_verified=',r['execution_odds_verified'])
          PY

      - name: Commit operational files
        run: |
          git config user.name 'stage53-bot'
          git config user.email 'stage53-bot@users.noreply.github.com'
          git add -A ops
          if git diff --cached --quiet; then
            echo 'No operational changes to commit.'
          else
            git commit -m 'Stage 53 daily screener update'
            git push
          fi

      - name: Upload daily operational snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage53-daily-ops
          path: ops/
          if-no-files-found: ignore
          retention-days: 30
