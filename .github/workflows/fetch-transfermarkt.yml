name: fetch-transfermarkt-dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-transfermarkt.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download current Transfermarkt DuckDB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data
          BASE='https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data'
          curl -fL --retry 5 --retry-delay 3 \
            "$BASE/transfermarkt-datasets.duckdb" \
            -o data/transfermarkt-datasets.duckdb
          curl -fL --retry 5 --retry-delay 3 \
            "$BASE/dataset-metadata.json" \
            -o data/dataset-metadata.json
          ls -lh data
          sha256sum data/* | tee data/SHA256SUMS.txt

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-dataset
          path: data/
          compression-level: 0
          retention-days: 7
