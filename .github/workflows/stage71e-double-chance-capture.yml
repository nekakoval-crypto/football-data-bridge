name: Stage 71E Double Chance Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    paths:
      - 'scripts/stage71e_double_chance_capture.py'
      - 'research/stage71e_double_chance_prereg_2026-09-11.md'
      - '.github/workflows/stage71e-double-chance-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      OPS_DIR: 'ops'
      API_FOOTBALL_SEASON: '2026'
      STAGE71E_USER_BOOKMAKER: 'Marathonbet'
      STAGE71E_OPEN_HORIZON_H: '336'
      STAGE71E_TRACK_HORIZON_H: '72'
      STAGE71E_NEXT_PER_LEAGUE: '10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture Double Chance market data
        run: |
          for attempt in 1 2 3; do
            echo "Stage71E attempt ${attempt}/3"
            if python scripts/stage71e_double_chance_capture.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Show Stage71E summary
        run: cat ops/stage71e_last_run.json
      - name: Commit Stage71E operational files
        run: |
          git config user.name 'stage71e-bot'
          git config user.email 'stage71e-bot@users.noreply.github.com'
          git add ops/stage71e_double_chance_openers.csv \
                  ops/stage71e_double_chance_snapshots.csv \
                  ops/stage71e_double_chance_closes.csv \
                  ops/stage71e_last_run.json
          if git diff --cached --quiet; then
            echo 'No Stage71E changes to commit.'
          else
            git commit -m 'Stage71E Double Chance capture update'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              sleep 2
            done
            exit 1
          fi
      - name: Upload Stage71E snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage71e-double-chance-capture
          path: |
            ops/stage71e_double_chance_openers.csv
            ops/stage71e_double_chance_snapshots.csv
            ops/stage71e_double_chance_closes.csv
            ops/stage71e_last_run.json
          if-no-files-found: ignore
          retention-days: 30
